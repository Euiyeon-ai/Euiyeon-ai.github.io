<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" font-family="Malgun Gothic, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F2937"/></marker>
  </defs>
  <rect width="1000" height="200" fill="#FFFFFF"/>
  <text x="500" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#1E3A8A">자연어처리 모델의 발전 흐름</text>

  <g font-size="15" text-anchor="middle" font-weight="700">
    <rect x="40" y="90" width="100" height="48" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="90" y="120" fill="#374151">RNN</text>

    <rect x="180" y="80" width="150" height="68" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/>
