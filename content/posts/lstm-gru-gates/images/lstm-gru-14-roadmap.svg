    <text x="255" y="133" fill="#B45309" font-size="13" font-weight="400">지금</text>

    <rect x="370" y="90" width="110" height="48" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="425" y="120" fill="#374151">Seq2Seq</text>

    <rect x="520" y="90" width="120" height="48" rx="12" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.5"/>
    <text x="580" y="120" fill="#1E3A8A">Attention</text>

    <rect x="680" y="90" width="140" height="48" rx="12" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.5"/>
    <text x="750" y="120" fill="#1E3A8A">Transformer</text>

    <rect x="860" y="90" width="100" height="48" rx="12" fill="#EDE9FE" stroke="#6D28D9" stroke-width="1.5"/>
    <text x="910" y="120" fill="#6D28D9">GPT</text>
  </g>
  <g stroke="#1F2937" stroke-width="2.2" fill="none">
    <line x1="140" y1="114" x2="178" y2="114" marker-end="url(#a)"/>
    <line x1="330" y1="114" x2="368" y2="114" marker-end="url(#a)"/>
    <line x1="480" y1="114" x2="518" y2="114" marker-end="url(#a)"/>
    <line x1="640" y1="114" x2="678" y2="114" marker-end="url(#a)"/>
    <line x1="820" y1="114" x2="858" y2="114" marker-end="url(#a)"/>
  </g>
  <text x="500" y="178" text-anchor="middle" font-size="12" fill="#6B7280">기억 → 오래 기억 → 문장 변환 → 찾아보기 → RNN 제거</text>
