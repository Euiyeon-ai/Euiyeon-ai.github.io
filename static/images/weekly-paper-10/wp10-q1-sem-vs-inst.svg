<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t1 d1">
  <title id="t1">시맨틱 세그멘테이션과 인스턴스 세그멘테이션의 출력 비교</title>
  <desc id="d1">같은 도로 장면에서 시맨틱 세그멘테이션은 모든 픽셀에 도로, 차, 사람 클래스를 칠하지만 왼쪽 차와 오른쪽 차가 같은 색이라 구별되지 않는다. 인스턴스 세그멘테이션은 차 1번, 차 2번, 사람 1번을 서로 다른 마스크로 내지만 도로 같은 배경은 칠하지 않는다.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    .bg{fill:#fcfcfb;stroke:rgba(11,11,11,.10)}
    .ttl{fill:#0b0b0b;font-size:16px;font-weight:700}
    .h{fill:#0b0b0b;font-size:13.5px;font-weight:700}
    .sub{fill:#52514e;font-size:12px}
    .mut{fill:#898781;font-size:11.5px}
    .panel{fill:none;stroke:#c3c2b7;stroke-width:1;stroke-dasharray:4 4}
    .scene{fill:#f4f4f1;stroke:#c3c2b7;stroke-width:1.2}
    .sky{fill:#e9eef3}
    .road{fill:#b9a9d9}
    .roadN{fill:#e4e3dd}
    .lane{stroke:#ffffff;stroke-width:2;stroke-dasharray:10 8;opacity:.8}
    .car{fill:#4a7fc1}.car2{fill:#e3a23c}.person{fill:#c8433b}
    .win{fill:#ffffff;opacity:.55}
    .wheel{fill:#3a3a38}
    .bx1{fill:none;stroke:#4a7fc1;stroke-width:1.5;stroke-dasharray:4 3}
    .bx2{fill:none;stroke:#e3a23c;stroke-width:1.5;stroke-dasharray:4 3}
    .bx3{fill:none;stroke:#c8433b;stroke-width:1.5;stroke-dasharray:4 3}
    .tag{font-size:11px;font-weight:700}
    .t1{fill:#2f5f9c}.t2{fill:#a86c0e}.t3{fill:#c8433b}
    .out{fill:#f4f4f1;stroke:#c3c2b7;stroke-width:1}
    .outT{fill:#0b0b0b;font-size:12.5px;font-weight:600}
    .bad{fill:#d03b3b;font-size:12px;font-weight:700}
    .good{fill:#3f8f5a;font-size:12px;font-weight:700}
    .num{font-variant-numeric:tabular-nums}
    .c0{fill:#e9eef3}.c1{fill:#b9a9d9}.c2{fill:#4a7fc1}.c3{fill:#c8433b}.c4{fill:#e3a23c}
    .off{fill:#ecebe6}
    .cell{stroke:#fcfcfb;stroke-width:1}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1a1a19;stroke:rgba(255,255,255,.10)}
      .ttl,.h,.outT{fill:#ffffff}
      .sub{fill:#c3c2b7}
      .mut{fill:#8f8d87}
      .panel{stroke:#383835}
      .scene,.out{fill:#232322;stroke:#383835}
      .sky,.c0{fill:#2a2f36}
      .road,.c1{fill:#6a5a94}
      .roadN{fill:#33332f}
      .off{fill:#2b2b29}
      .cell{stroke:#1a1a19}
      .lane{opacity:.35}
      .win{fill:#000000;opacity:.25}
      .wheel{fill:#0e0e0d}
      .t1{fill:#8db4e6}.t2{fill:#f0c06c}.t3{fill:#f08a82}
    }
  </style>
  <rect class="bg" x=".5" y=".5" width="719" height="359" rx="10"/>
  <text class="ttl" x="24" y="30">같은 도로 장면, 다른 질문</text>
  <text class="mut" x="24" y="50">색 = 모델이 붙인 답. 왼쪽은 종류마다 한 색, 오른쪽은 개체마다 한 색</text>

  <rect class="panel" x="16" y="62" width="336" height="282" rx="8"/>
  <text class="h" x="32" y="86">시맨틱 세그멘테이션</text>
  <text class="sub" x="176" y="86">픽셀마다 종류 1개</text>
  <g>
    <rect class="scene" x="39" y="98" width="290" height="150" rx="6"/>
    <rect class="sky" x="40" y="99" width="288" height="71"/>
    <rect class="road" x="40" y="170" width="288" height="77"/>
    <line class="lane" x1="49" y1="232" x2="319" y2="232"/>
    <rect class="car" x="75" y="148" width="52" height="24" rx="7"/>
    <rect class="win" x="81" y="153" width="18" height="13" rx="2"/><rect class="win" x="103" y="153" width="18" height="13" rx="2"/>
    <rect class="car" x="61" y="166" width="80" height="30" rx="8"/>
    <circle class="wheel" cx="79" cy="196" r="8"/><circle class="wheel" cx="123" cy="196" r="8"/>
    <rect class="car" x="241" y="148" width="52" height="24" rx="7"/>
    <rect class="win" x="247" y="153" width="18" height="13" rx="2"/><rect class="win" x="269" y="153" width="18" height="13" rx="2"/>
    <rect class="car" x="227" y="166" width="80" height="30" rx="8"/>
    <circle class="wheel" cx="245" cy="196" r="8"/><circle class="wheel" cx="289" cy="196" r="8"/>
    <circle class="person" cx="184" cy="145" r="7"/>
    <rect class="person" x="176" y="154" width="16" height="30" rx="5"/>
    <rect class="person" x="177" y="182" width="6" height="22" rx="2"/><rect class="person" x="185" y="182" width="6" height="22" rx="2"/>
  </g>
  <rect class="out" x="32" y="262" width="304" height="68" rx="6"/>
  <text class="outT" x="44" y="284">출력 : 클래스 지도 1장 (H×W)</text>
  <text class="good" x="44" y="306">✓ 도로 · 차 · 사람 영역<tspan class="bad" dx="14">✗ 차가 몇 대?</tspan></text>
  <text class="mut" x="44" y="323">두 차 모두 "차" 한 색 → 붙어 있으면 한 덩어리</text>

  <rect class="panel" x="368" y="62" width="336" height="282" rx="8"/>
  <text class="h" x="384" y="86">인스턴스 세그멘테이션</text>
  <text class="sub" x="540" y="86">개체마다 마스크 1장</text>
  <g>
    <rect class="scene" x="391" y="98" width="290" height="150" rx="6"/>
    <rect class="sky" x="392" y="99" width="288" height="71"/>
    <rect class="roadN" x="392" y="170" width="288" height="77"/>
    <line class="lane" x1="401" y1="232" x2="671" y2="232"/>
    <rect class="car" x="427" y="148" width="52" height="24" rx="7"/>
    <rect class="win" x="433" y="153" width="18" height="13" rx="2"/><rect class="win" x="455" y="153" width="18" height="13" rx="2"/>
    <rect class="car" x="413" y="166" width="80" height="30" rx="8"/>
    <circle class="wheel" cx="431" cy="196" r="8"/><circle class="wheel" cx="475" cy="196" r="8"/>
    <rect class="car2" x="593" y="148" width="52" height="24" rx="7"/>
    <rect class="win" x="599" y="153" width="18" height="13" rx="2"/><rect class="win" x="621" y="153" width="18" height="13" rx="2"/>
    <rect class="car2" x="579" y="166" width="80" height="30" rx="8"/>
    <circle class="wheel" cx="597" cy="196" r="8"/><circle class="wheel" cx="641" cy="196" r="8"/>
    <circle class="person" cx="536" cy="145" r="7"/>
    <rect class="person" x="528" y="154" width="16" height="30" rx="5"/>
    <rect class="person" x="529" y="182" width="6" height="22" rx="2"/><rect class="person" x="537" y="182" width="6" height="22" rx="2"/>
    <rect class="bx1" x="409" y="144" width="88" height="64" rx="2"/>
    <text class="tag t1" x="409" y="138">차 #1</text>
    <rect class="bx2" x="575" y="144" width="88" height="64" rx="2"/>
    <text class="tag t2" x="575" y="138">차 #2</text>
    <rect class="bx3" x="523" y="133" width="26" height="76" rx="2"/>
    <text class="tag t3" x="513" y="127">사람 #1</text>
  </g>
  <rect class="out" x="384" y="262" width="304" height="68" rx="6"/>
  <text class="outT num" x="396" y="284">출력 : 마스크 3장 + 종류 + 점수</text>
  <text class="good" x="396" y="306">✓ 차 #1 ≠ 차 #2<tspan class="bad" dx="14">✗ 도로는 칠하지 않음</tspan></text>
  <text class="mut" x="396" y="323">도로 · 하늘은 셀 수 없어서 개체가 아니다</text>
</svg>
