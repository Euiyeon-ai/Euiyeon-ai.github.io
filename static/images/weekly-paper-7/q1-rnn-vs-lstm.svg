<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-labelledby="t1 d1">
  <title id="t1">RNN의 통째로 다시 쓰기와 LSTM의 곧은 길 비교</title>
  <desc id="d1">RNN은 매 칸 hidden state를 tanh와 W로 통째로 다시 만들어 100칸 뒤에는 앞 단어 정보와 gradient가 사라진다. LSTM은 cell state라는 곧은 길에 곱하기와 더하기만 두어, forget gate가 열려 있으면 정보와 gradient가 그대로 흐른다.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
    .bg{fill:#fcfcfb;stroke:rgba(11,11,11,.10)}
    .ttl{fill:#0b0b0b;font-size:16px;font-weight:700}
    .h{fill:#0b0b0b;font-size:13px;font-weight:700}
    .sub{fill:#52514e;font-size:12px}
    .mut{fill:#898781;font-size:11.5px}
    .layer{fill:#f4f4f1;stroke:#c3c2b7;stroke-width:1.5}
    .layerDead{fill:#f7ecec;stroke:#d03b3b;stroke-width:1.5}
    .layerOk{fill:#eaf3ec;stroke:#3f8f5a;stroke-width:1.5}
    .ax{stroke:#c3c2b7;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
    .pipe{stroke:#3f8f5a;stroke-width:6;fill:none;stroke-linecap:round}
    .gate{fill:#fcfcfb;stroke:#3f8f5a;stroke-width:1.5}
    .bad{fill:#d03b3b;font-size:12px;font-weight:700}
    .good{fill:#3f8f5a;font-size:12px;font-weight:700}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1a1a19;stroke:rgba(255,255,255,.10)}
      .ttl,.h{fill:#ffffff}
      .sub{fill:#c3c2b7}
      .mut{fill:#8f8d87}
      .layer{fill:#232322;stroke:#383835}
      .layerDead{fill:#2c2220;stroke:#a83030}
      .layerOk{fill:#1f2a22;stroke:#3f8f5a}
      .gate{fill:#1a1a19}
      .ax{stroke:#6b6a64}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/>
    </marker>
  </defs>
  <rect class="bg" x=".5" y=".5" width="719" height="249" rx="10"/>
  <text class="ttl" x="24" y="30">RNN은 매 칸 통째로 다시 쓰고, LSTM은 곧은 길에 지우기·덧붙이기만 한다</text>

  <!-- RNN row -->
  <text class="h" x="24" y="66">RNN</text>
  <text class="mut" x="24" y="82">h = tanh(W·h + W·x)</text>
  <rect class="layerOk" x="160" y="54" width="70" height="36" rx="8"/>
  <text class="h" x="195" y="77" text-anchor="middle">"최고의"</text>
  <rect class="layer" x="260" y="54" width="70" height="36" rx="8"/>
  <text class="sub" x="295" y="77" text-anchor="middle">다시 씀</text>
  <rect class="layer" x="360" y="54" width="70" height="36" rx="8"/>
  <text class="sub" x="395" y="77" text-anchor="middle">다시 씀</text>
  <rect class="layer" x="460" y="54" width="70" height="36" rx="8"/>
  <text class="sub" x="495" y="77" text-anchor="middle">… x100</text>
  <rect class="layerDead" x="560" y="54" width="130" height="36" rx="8"/>
  <text class="bad" x="625" y="77" text-anchor="middle">앞 단어 흔적 ≈ 0</text>
  <line class="ax" x1="230" y1="72" x2="258" y2="72"/>
  <line class="ax" x1="330" y1="72" x2="358" y2="72"/>
  <line class="ax" x1="430" y1="72" x2="458" y2="72"/>
  <line class="ax" x1="530" y1="72" x2="558" y2="72"/>
  <text class="mut" x="160" y="108">0.9 를 100번 곱하면 ≈ 0.00003 → 정보도, 거꾸로 오는 gradient도 사라짐</text>

  <!-- LSTM row -->
  <text class="h" x="24" y="160">LSTM</text>
  <text class="mut" x="24" y="176">c = f × c + i × g</text>
  <rect class="layerOk" x="160" y="146" width="70" height="36" rx="8"/>
  <text class="h" x="195" y="169" text-anchor="middle">"최고의"</text>
  <line class="pipe" x1="232" y1="164" x2="556" y2="164"/>
  <circle class="gate" cx="280" cy="164" r="13"/>
  <text class="good" x="280" y="168" text-anchor="middle">×f</text>
  <circle class="gate" cx="330" cy="164" r="13"/>
  <text class="good" x="330" y="168" text-anchor="middle">+</text>
  <circle class="gate" cx="400" cy="164" r="13"/>
  <text class="good" x="400" y="168" text-anchor="middle">×f</text>
  <circle class="gate" cx="450" cy="164" r="13"/>
  <text class="good" x="450" y="168" text-anchor="middle">+</text>
  <text class="sub" x="510" y="154" text-anchor="middle">… x100</text>
  <rect class="layerOk" x="560" y="146" width="130" height="36" rx="8"/>
  <text class="good" x="625" y="169" text-anchor="middle">"최고의" 유지</text>
  <text class="mut" x="160" y="202">cell state = 곧은 길. 곱하기(지움)·더하기(덧붙임)만. forget gate f ≈ 1 이면 그대로 간다</text>
  <text class="mut" x="160" y="220">단, f 가 0.5 로 닫혀 있으면 0.5 를 100번 곱하는 것 → RNN과 똑같이 죽는다</text>
</svg>
