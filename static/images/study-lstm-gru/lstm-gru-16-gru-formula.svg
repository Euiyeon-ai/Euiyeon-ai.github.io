<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Malgun Gothic, 'Apple SD Gothic Neo', sans-serif"><rect width="1000" height="400" fill="#FFFFFF"/><text x="30" y="34" font-size="17" font-weight="700" fill="#1F2937">GRU 수식 — LSTM 에서 줄인 것</text><text x="30" y="56" font-size="13" fill="#6B7280">fₜ, iₜ 둘  →  (1−zₜ), zₜ 하나.   output gate 없음 → h 가 그대로 출력</text><rect x="30" y="81" width="118" height="30" rx="15" fill="#E3B071"/>
<text x="89" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">reset</text>
<text x="170" y="103" font-size="21" font-family="Cambria Math, Times New Roman, serif" fill="#1F2937"><tspan fill="#C77D2E">rₜ</tspan><tspan fill="#1F2937"> = σ( W</tspan><tspan fill="#1F2937">r</tspan><tspan fill="#1F2937"> </tspan><tspan fill="#6B7280">[h</tspan><tspan fill="#6B7280">ₜ₋₁</tspan><tspan fill="#6B7280">, x</tspan><tspan fill="#6B7280">ₜ</tspan><tspan fill="#6B7280">]</tspan><tspan fill="#1F2937"> )</tspan></text>
<text x="640" y="103" font-size="14" fill="#6B7280">새 후보 만들 때  옛 h 를 얼마나 볼까</text>
<rect x="30" y="141" width="118" height="30" rx="15" fill="#E3B071"/>
<text x="89" y="161" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">update</text>
<text x="170" y="163" font-size="21" font-family="Cambria Math, Times New Roman, serif" fill="#1F2937"><tspan fill="#C77D2E">zₜ</tspan><tspan fill="#1F2937"> = σ( W</tspan><tspan fill="#1F2937">z</tspan><tspan fill="#1F2937"> </tspan><tspan fill="#6B7280">[h</tspan><tspan fill="#6B7280">ₜ₋₁</tspan><tspan fill="#6B7280">, x</tspan><tspan fill="#6B7280">ₜ</tspan><tspan fill="#6B7280">]</tspan><tspan fill="#1F2937"> )</tspan></text>
<text x="640" y="163" font-size="14" fill="#6B7280">옛것 / 새것 비율을  하나로</text>
<rect x="30" y="201" width="118" height="30" rx="15" fill="#8FAEDF"/>
<text x="89" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">새 후보</text>
<text x="170" y="223" font-size="21" font-family="Cambria Math, Times New Roman, serif" fill="#1F2937"><tspan fill="#3F5F98">h̃ₜ</tspan><tspan fill="#1F2937"> = tanh( W [ </tspan><tspan fill="#C77D2E">rₜ</tspan><tspan fill="#1F2937"> ⊙ </tspan><tspan fill="#6B7280">hₜ₋₁</tspan><tspan fill="#6B7280">, xₜ</tspan><tspan fill="#1F2937"> ] )</tspan></text>
<text x="640" y="223" font-size="14" fill="#6B7280">r 로 걸러진 옛 h  +  지금 입력</text>
<rect x="20" y="262" width="960" height="54" rx="8" fill="#FBEFEF"/>
<rect x="30" y="271" width="118" height="30" rx="15" fill="#E08E8E"/>
<text x="89" y="291" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">파이프 = h</text>
<text x="170" y="293" font-size="21" font-family="Cambria Math, Times New Roman, serif" fill="#1F2937"><tspan fill="#B85454" font-weight="700">hₜ</tspan><tspan fill="#1F2937"> = </tspan><tspan fill="#C77D2E">(1−zₜ)</tspan><tspan fill="#1F2937"> ⊙ </tspan><tspan fill="#B85454" font-weight="700">hₜ₋₁</tspan><tspan fill="#1F2937">  +  </tspan><tspan fill="#C77D2E">zₜ</tspan><tspan fill="#1F2937"> ⊙ </tspan><tspan fill="#3F5F98">h̃ₜ</tspan></text>
<text x="640" y="293" font-size="14" fill="#6B7280">남길 옛것 + 넣을 새것 = 항상 1.   c 없이 h 가 파이프</text><rect x="20" y="348" width="960" height="40" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
<rect x="30" y="359" width="14" height="14" rx="3" fill="#E3B071"/>
<text x="50" y="371" font-size="13" fill="#374151">σ  Gate — 얼마나 (0~1)</text>
<rect x="270" y="359" width="14" height="14" rx="3" fill="#8FAEDF"/>
<text x="290" y="371" font-size="13" fill="#374151">tanh  새 후보 — 무엇을 (−1~1)</text>
<rect x="510" y="359" width="14" height="14" rx="3" fill="#E08E8E"/>
<text x="530" y="371" font-size="13" fill="#374151">파이프 c — 곱 · 더하기만</text>
<rect x="750" y="359" width="14" height="14" rx="3" fill="#B3A6DF"/>
<text x="770" y="371" font-size="13" fill="#374151">출력 h</text></svg>