<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" role="img" aria-labelledby="t6 d6">
  <title id="t6">gradient accumulation 구조</title>
  <desc id="d6">배치 64를 4번 forward와 backward 하면서 gradient를 더해두고, 4번째에 한 번만 update한다. 메모리는 64개분만 쓰지만 효과는 배치 256과 같다.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
    .bg{fill:#fcfcfb;stroke:rgba(11,11,11,.10)}
    .ttl{fill:#0b0b0b;font-size:16px;font-weight:700}
    .h{fill:#0b0b0b;font-size:13px;font-weight:700}
    .sub{fill:#52514e;font-size:12px}
    .mut{fill:#898781;font-size:11px}
    .pane{fill:#f4f4f1;stroke:#c3c2b7;stroke-width:1.5}
    .paneOk{fill:#eaf3ec;stroke:#3f8f5a;stroke-width:1.5}
    .ax{stroke:#c3c2b7;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
    .acc{stroke:#3f8f5a;stroke-width:1.6;fill:none;marker-end:url(#arrowG)}
    .good{fill:#3f8f5a;font-size:12px;font-weight:700}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1a1a19;stroke:rgba(255,255,255,.10)}
      .ttl,.h{fill:#ffffff} .sub{fill:#c3c2b7} .mut{fill:#8f8d87}
      .pane{fill:#232322;stroke:#383835}
      .paneOk{fill:#1f2a22;stroke:#3f8f5a}
      .ax{stroke:#6b6a64}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f8f5a"/>
    </marker>
  </defs>
  <rect class="bg" x=".5" y=".5" width="719" height="229" rx="10"/>
  <text class="ttl" x="24" y="30">메모리는 64개분, 효과는 256개분</text>

  <rect class="pane" x="24" y="60" width="120" height="60" rx="8"/>
  <text class="h" x="84" y="84" text-anchor="middle">배치 64</text>
  <text class="mut" x="84" y="102" text-anchor="middle">forward + backward</text>
  <line class="ax" x1="144" y1="90" x2="170" y2="90"/>

  <rect class="pane" x="172" y="60" width="120" height="60" rx="8"/>
  <text class="h" x="232" y="84" text-anchor="middle">배치 64</text>
  <text class="mut" x="232" y="102" text-anchor="middle">forward + backward</text>
  <line class="ax" x1="292" y1="90" x2="318" y2="90"/>

  <rect class="pane" x="320" y="60" width="120" height="60" rx="8"/>
  <text class="h" x="380" y="84" text-anchor="middle">배치 64</text>
  <text class="mut" x="380" y="102" text-anchor="middle">forward + backward</text>
  <line class="ax" x1="440" y1="90" x2="466" y2="90"/>

  <rect class="pane" x="468" y="60" width="120" height="60" rx="8"/>
  <text class="h" x="528" y="84" text-anchor="middle">배치 64</text>
  <text class="mut" x="528" y="102" text-anchor="middle">forward + backward</text>
  <line class="acc" x1="588" y1="90" x2="614" y2="90"/>

  <rect class="paneOk" x="616" y="60" width="80" height="60" rx="8"/>
  <text class="good" x="656" y="84" text-anchor="middle">update</text>
  <text class="mut" x="656" y="102" text-anchor="middle">1번만</text>

  <line class="acc" x1="84" y1="130" x2="84" y2="150"/>
  <line class="acc" x1="232" y1="130" x2="232" y2="150"/>
  <line class="acc" x1="380" y1="130" x2="380" y2="150"/>
  <line class="acc" x1="528" y1="130" x2="528" y2="150"/>
  <rect class="paneOk" x="24" y="152" width="564" height="34" rx="8"/>
  <text class="good" x="306" y="174" text-anchor="middle">gradient를 지우지 않고 4번 더해둔다 (zero_grad 안 함) = 배치 256의 gradient</text>

  <text class="mut" x="360" y="212" text-anchor="middle">GPU에는 항상 64개만 올라가 있음. 4번마다 optimizer.step() 후 zero_grad()</text>
</svg>
