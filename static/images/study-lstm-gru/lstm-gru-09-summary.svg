<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Malgun Gothic, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F2937"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B91C1C"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803D"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1E3A8A"/></marker>
  </defs>
  <rect width="1000" height="300" fill="#FFFFFF"/>

  <!-- RNN -->
  <rect x="30" y="30" width="295" height="230" rx="14" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="177" y="62" text-anchor="middle" font-size="18" font-weight="700" fill="#B91C1C">RNN</text>
  <!-- 그림: h 박스 + 루프 -->
  <rect x="140" y="95" width="75" height="44" rx="9" fill="#fff" stroke="#B91C1C" stroke-width="2"/>
  <text x="177" y="123" text-anchor="middle" font-size="16" font-weight="700" fill="#B91C1C">h</text>
  <path d="M215 105 C 265 80, 265 155, 217 130" fill="none" stroke="#B91C1C" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="262" y="122" font-size="11" fill="#B91C1C">덮어씀</text>
  <line x1="90" y1="117" x2="138" y2="117" stroke="#1F2937" stroke-width="2" marker-end="url(#a)"/>
  <text x="70" y="121" text-anchor="end" font-size="12" fill="#374151">x</text>
  <!-- 텍스트 -->
  <g font-size="13" fill="#7F1D1D">
    <text x="50" y="180">· 메모 h 하나, 매 칸 새로 계산</text>
    <text x="50" y="205">· 4칸에 1/8 → 먼 과거 못 배움</text>
    <text x="50" y="230">· Gate 없음</text>
  </g>

  <!-- LSTM -->
  <rect x="352" y="30" width="295" height="230" rx="14" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="500" y="62" text-anchor="middle" font-size="18" font-weight="700" fill="#15803D">LSTM</text>
  <!-- 그림: c 직선 + h -->
  <line x1="380" y1="100" x2="620" y2="100" stroke="#B91C1C" stroke-width="4" marker-end="url(#ar)"/>
  <text x="372" y="104" text-anchor="end" font-size="12" fill="#B91C1C">c</text>
  <circle cx="440" cy="100" r="9" fill="#fff" stroke="#B91C1C" stroke-width="2"/><text x="440" y="104" text-anchor="middle" font-size="11" fill="#B91C1C">×</text>
  <circle cx="500" cy="100" r="9" fill="#fff" stroke="#B91C1C" stroke-width="2"/><text x="500" y="105" text-anchor="middle" font-size="13" fill="#B91C1C" font-weight="700">+</text>
  <line x1="380" y1="140" x2="620" y2="140" stroke="#1E3A8A" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="372" y="144" text-anchor="end" font-size="12" fill="#1E3A8A">h</text>
  <circle cx="560" cy="140" r="9" fill="#fff" stroke="#6D28D9" stroke-width="2"/><text x="560" y="144" text-anchor="middle" font-size="11" fill="#6D28D9">×</text>
  <line x1="560" y1="109" x2="560" y2="130" stroke="#1F2937" stroke-width="1.5" marker-end="url(#a)"/>
  <g font-size="10" text-anchor="middle">
    <text x="440" y="124" fill="#B91C1C">forget</text>
    <text x="500" y="124" fill="#15803D">input</text>
    <text x="590" y="158" fill="#6D28D9">output</text>
  </g>
  <g font-size="13" fill="#14532D">
    <text x="372" y="180">· 새 줄 c — 곱 · 더하기만, 덮어쓰기 없음</text>
    <text x="372" y="205">· Gate 3 · 줄 2. Gate 열려야 효과</text>
    <text x="372" y="230">· 소실을 "해결"이 아니라 "늦춤"</text>
  </g>

  <!-- GRU -->
  <rect x="674" y="30" width="295" height="230" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="821" y="62" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A8A">GRU</text>
  <!-- 그림: h 한 줄 + z -->
  <line x1="700" y1="120" x2="940" y2="120" stroke="#1E3A8A" stroke-width="4" marker-end="url(#ab)"/>
  <text x="692" y="124" text-anchor="end" font-size="12" fill="#1E3A8A">h</text>
  <circle cx="770" cy="120" r="9" fill="#fff" stroke="#15803D" stroke-width="2"/><text x="770" y="124" text-anchor="middle" font-size="11" fill="#15803D">×</text>
  <circle cx="850" cy="120" r="9" fill="#fff" stroke="#15803D" stroke-width="2"/><text x="850" y="125" text-anchor="middle" font-size="13" fill="#15803D" font-weight="700">+</text>
  <g font-size="10" text-anchor="middle">
    <text x="770" y="144" fill="#15803D">1−z</text>
    <text x="850" y="144" fill="#15803D">z</text>
  </g>
  <text x="810" y="98" text-anchor="middle" font-size="11" fill="#6B7280">손잡이 하나 z</text>
  <g font-size="13" fill="#1E40AF">
    <text x="694" y="180">· c 와 h 를 한 줄로</text>
    <text x="694" y="205">· Gate 2 · 줄 1 (남김 1−z, 넣음 z)</text>
    <text x="694" y="230">· 성능은 LSTM보다 항상 좋다 ✗ (task 마다 다름)</text>
  </g>

</svg>
