<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="t2 d2">
  <title id="t2">단일 결정 트리와 앙상블의 설명 가능성 차이</title>
  <desc id="d2">단일 결정 트리는 부채비율이 높고 소득이 낮다는 조건을 따라가면 거절이라는 하나의 경로로 설명할 수 있다. 랜덤 포레스트나 그레이디언트 부스팅은 여러 개의 작은 트리가 각자 판단한 결과를 투표하거나 누적해서 최종 결과를 만들기 때문에 한 고객이 왜 거절되었는지를 하나의 경로로 보여주기 어렵다.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
    .bg{fill:#fcfcfb;stroke:rgba(11,11,11,.10)}
    .ttl{fill:#0b0b0b;font-size:16px;font-weight:700}
    .h{fill:#0b0b0b;font-size:13.5px;font-weight:700}
    .sub{fill:#52514e;font-size:12px}
    .mut{fill:#898781;font-size:11px}
    .pane{fill:#f4f4f1;stroke:#c3c2b7;stroke-width:1.5}
    .node{fill:#e8e8e4;stroke:#9c9b93;stroke-width:1.3}
    .nodeBad{fill:#f7ecec;stroke:#d03b3b;stroke-width:1.6}
    .edge{stroke:#c3c2b7;stroke-width:1.4;fill:none}
    .edgeBad{stroke:#d03b3b;stroke-width:2.2;fill:none}
    .bad{fill:#d03b3b}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1a1a19;stroke:rgba(255,255,255,.10)}
      .ttl,.h{fill:#ffffff}
      .sub{fill:#c3c2b7}
      .mut{fill:#8f8d87}
      .pane{fill:#232322;stroke:#383835}
      .node{fill:#2c2c2a;stroke:#5b5a54}
      .nodeBad{fill:#2c2220;stroke:#a83030}
      .edge{stroke:#5b5a54}
    }
  </style>
  <rect class="bg" x=".5" y=".5" width="719" height="319" rx="10"/>
  <text class="ttl" x="24" y="30">경로가 하나로 보이는가, 여러 개가 섞이는가</text>

  <!-- 좌: 단일 결정 트리 -->
  <rect class="pane" x="20" y="48" width="330" height="252" rx="8"/>
  <text class="h" x="36" y="72">단일 결정 트리</text>
  <text class="mut" x="36" y="88">거절 사유를 경로 하나로 설명</text>

  <circle class="nodeBad" cx="185" cy="120" r="18"/>
  <text class="sub" x="185" y="124" text-anchor="middle" style="font-size:10.5px">부채비율</text>

  <path class="edgeBad" d="M185,138 L130,180"/>
  <path class="edge" d="M185,138 L240,180"/>
  <text class="sub bad" x="140" y="162" style="font-size:10.5px">&gt; 40%</text>
  <text class="mut" x="250" y="162" style="font-size:10.5px">≤ 40%</text>

  <circle class="nodeBad" cx="130" cy="198" r="18"/>
  <text class="sub" x="130" y="202" text-anchor="middle" style="font-size:10.5px">소득</text>
  <circle class="node" cx="240" cy="198" r="16"/>
  <text class="sub" x="240" y="202" text-anchor="middle" style="font-size:9.5px">승인</text>

  <path class="edgeBad" d="M130,216 L100,252"/>
  <path class="edge" d="M130,216 L165,252"/>
  <text class="sub bad" x="88" y="238" style="font-size:10.5px">&lt; 300</text>
  <text class="mut" x="168" y="238" style="font-size:10.5px">≥ 300</text>

  <rect class="nodeBad" x="70" y="256" width="72" height="30" rx="6"/>
  <text class="sub bad" x="106" y="275" text-anchor="middle" style="font-size:11px;font-weight:700">거절</text>
  <rect class="node" x="150" y="256" width="72" height="30" rx="6"/>
  <text class="sub" x="186" y="275" text-anchor="middle" style="font-size:10.5px">승인</text>

  <text class="sub bad" x="270" y="270" style="font-size:11px">"부채비율 40% 초과 +</text>
  <text class="sub bad" x="270" y="284" style="font-size:11px">소득 300 미만"으로 설명 가능</text>

  <!-- 우: 앙상블 -->
  <rect class="pane" x="370" y="48" width="330" height="252" rx="8"/>
  <text class="h" x="386" y="72">랜덤 포레스트 · 그레이디언트 부스팅</text>
  <text class="mut" x="386" y="88">여러 트리의 결과를 종합</text>

  <!-- 3 mini trees -->
  <g>
    <circle class="node" cx="420" cy="130" r="12"/>
    <path class="edge" d="M420,142 L410,158"/>
    <path class="edge" d="M420,142 L430,158"/>
    <circle class="node" cx="410" cy="164" r="9"/>
    <circle class="node" cx="430" cy="164" r="9"/>
    <text class="mut" x="420" y="190" text-anchor="middle">트리 1: 거절</text>
  </g>
  <g>
    <circle class="node" cx="500" cy="130" r="12"/>
    <path class="edge" d="M500,142 L490,158"/>
    <path class="edge" d="M500,142 L510,158"/>
    <circle class="node" cx="490" cy="164" r="9"/>
    <circle class="node" cx="510" cy="164" r="9"/>
    <text class="mut" x="500" y="190" text-anchor="middle">트리 2: 승인</text>
  </g>
  <g>
    <circle class="node" cx="580" cy="130" r="12"/>
    <path class="edge" d="M580,142 L570,158"/>
    <path class="edge" d="M580,142 L590,158"/>
    <circle class="node" cx="570" cy="164" r="9"/>
    <circle class="node" cx="590" cy="164" r="9"/>
    <text class="mut" x="580" y="190" text-anchor="middle">트리 3: 거절</text>
  </g>
  <text class="mut" x="650" y="130" text-anchor="middle">…수십~수백 개</text>

  <path class="edge" d="M420,190 L500,224"/>
  <path class="edge" d="M500,190 L500,224"/>
  <path class="edge" d="M580,190 L500,224"/>

  <rect class="nodeBad" x="440" y="228" width="120" height="34" rx="6"/>
  <text class="sub bad" x="500" y="249" text-anchor="middle" style="font-size:11px;font-weight:700">종합: 거절 (71%)</text>

  <text class="sub" x="386" y="286" style="font-size:11px">"왜?"에 하나의 경로로 답하기 어렵다</text>
</svg>
