<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Malgun Gothic, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F2937"/></marker>
  </defs>
  <rect width="1000" height="330" fill="#FFFFFF"/>

  <!-- 층위 라벨 -->
  <text x="30" y="90" font-size="12" fill="#6B7280">모델 구조</text>
  <text x="30" y="108" font-size="12" fill="#6B7280">"어떻게 기억할까"</text>
  <text x="30" y="215" font-size="12" fill="#6B7280">활용 구조</text>
  <text x="30" y="233" font-size="12" fill="#6B7280">"어떻게 쓸까"</text>
  <line x1="150" y1="160" x2="970" y2="160" stroke="#E5E7EB" stroke-dasharray="6 4"/>

  <!-- 상단 행: 모델 구조 -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="160" y="60" width="130" height="70" rx="12" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/>
    <text x="225" y="88" fill="#B91C1C">RNN</text>
    <text x="225" y="112" fill="#7F1D1D" font-size="12" font-weight="400">과거를 기억하자</text>

    <rect x="340" y="60" width="150" height="70" rx="12" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
    <text x="415" y="88" fill="#15803D">LSTM · GRU</text>
    <text x="415" y="112" fill="#14532D" font-size="12" font-weight="400">먼 과거도 잘 학습하자</text>

    <rect x="620" y="60" width="140" height="70" rx="12" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="2"/>
    <text x="690" y="88" fill="#1E3A8A">Attention</text>
    <text x="690" y="112" fill="#1E40AF" font-size="12" font-weight="400">필요한 곳을 직접 보자</text>

    <rect x="810" y="60" width="160" height="70" rx="12" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2"/>
    <text x="890" y="88" fill="#6D28D9">Transformer</text>
    <text x="890" y="112" fill="#4C1D95" font-size="12" font-weight="400">RNN 없이 Attention만</text>
  </g>

  <!-- 하단 행: 활용 구조 -->
  <rect x="470" y="190" width="200" height="70" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="570" y="218" text-anchor="middle" font-size="15" font-weight="700" fill="#B45309">[ Seq2Seq ]</text>
  <text x="570" y="242" text-anchor="middle" font-size="12" fill="#78350F">Encoder → Context → Decoder</text>

  <!-- 화살표 -->
  <g stroke="#1F2937" stroke-width="2" fill="none">
    <line x1="290" y1="95" x2="338" y2="95" marker-end="url(#a)"/>
    <path d="M490 95 L540 95 L540 188" marker-end="url(#a)"/>
    <path d="M600 188 L600 95 L618 95" marker-end="url(#a)"/>
    <line x1="760" y1="95" x2="808" y2="95" marker-end="url(#a)"/>
  </g>
  <text x="532" y="150" text-anchor="end" font-size="11" fill="#6B7280">LSTM/GRU 를</text>
  <text x="532" y="164" text-anchor="end" font-size="11" fill="#6B7280">이어 붙임</text>
  <text x="605" y="150" font-size="11" fill="#B91C1C">Context 하나에</text>
  <text x="605" y="164" font-size="11" fill="#B91C1C">압축 → 병목</text>

  <!-- 하단 한 줄 -->
  <rect x="150" y="285" width="820" height="32" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="560" y="306" text-anchor="middle" font-size="13" fill="#374151">기억 → 오래 기억 → 문장 변환 → 찾아보기 → RNN 제거</text>
</svg>
