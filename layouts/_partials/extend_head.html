<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --main-width: 760px;
    --accent: #2563eb;
    --surface: #f5f7fa;
    --font-body: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
  }
  :root[data-theme="dark"] {
    --accent: #7aa2ff;
    --surface: rgb(38, 39, 43);
  }
  body { font-family: var(--font-body); font-size: 17px; letter-spacing: -0.01em; }
  .post-content a { color: var(--accent); box-shadow: none; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

  /* 홈 소개 */
  .home-info { padding: 8px 0 4px; background: none; border: none; box-shadow: none; }
  .home-info .entry-header h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
  .home-info .entry-content { color: var(--secondary); font-size: 17px; line-height: 1.8; }
  .home-info .entry-content strong { color: var(--primary); }
  .home-info .entry-content ul { margin: 12px 0 0; padding-left: 0; list-style: none; }
  .home-info .entry-content li { margin: 4px 0; }

  /* 홈 묶음 */
  .home-group { margin-top: 48px; }
  .home-group-title { margin-bottom: 4px; padding-bottom: 10px; font-size: 26px; font-weight: 800; border-bottom: 2px solid var(--primary); }
  .home-section-title { margin: 28px 0 12px; font-size: 19px; font-weight: 700; }
  .home-section-count { margin-left: 4px; font-size: 15px; font-weight: 500; color: var(--secondary); }

  /* 글 카드 */
  .doc-list { display: grid; gap: 10px; }
  .doc-card.post-entry { margin: 0; padding: 18px 20px; background: var(--entry); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: none; transition: border-color .15s, box-shadow .15s, transform .15s; }
  .doc-card.post-entry:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); box-shadow: 0 6px 20px rgba(16, 24, 40, .06); transform: none; }
  .doc-card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 4px; font-size: 14px; color: var(--secondary); }
  .doc-card-cat { padding: 1px 9px; background: var(--surface); border-radius: 999px; color: var(--primary); font-weight: 500; }
  .doc-card-title { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.4; color: var(--primary); }
  .doc-card-desc { margin: 6px 0 0; font-size: 15px; line-height: 1.65; color: var(--secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .doc-card-tags { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--accent); }

  /* 드롭다운 메뉴 */
  .menu-dropdown { position: relative; }
  .menu-dropdown-toggle { display: inline-flex; align-items: center; gap: 4px; padding: 0; font: inherit; font-size: 16px; color: inherit; background: none; border: none; cursor: pointer; line-height: var(--header-height); }
  .menu-caret { color: var(--secondary); transition: transform .15s; }
  .menu-dropdown-list { position: absolute; top: calc(100% - 10px); left: 0; z-index: 10; display: none; min-width: 180px; margin: 0; padding: 6px; list-style: none; background: var(--entry); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(16, 24, 40, .1); }
  .menu-dropdown:hover .menu-dropdown-list, .menu-dropdown:focus-within .menu-dropdown-list, .menu-dropdown.open .menu-dropdown-list { display: block; }
  .menu-dropdown:hover .menu-caret, .menu-dropdown.open .menu-caret { transform: rotate(180deg); }
  .menu-dropdown-list li { margin: 0; }
  .menu-dropdown-list a { display: flex; justify-content: space-between; gap: 16px; padding: 8px 10px; font-size: 15px; line-height: 1.4; border-radius: 6px; }
  .menu-dropdown-list a:hover, .menu-dropdown-list a.active { background: var(--surface); }
  .menu-count { color: var(--secondary); font-size: 13px; }
  @media screen and (max-width: 768px) {
    .menu-dropdown-list { left: auto; right: 0; }
  }
</style>
