<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" aria-labelledby="t4 d4">
  <title id="t4">기울기 소실 접근 순서</title>
  <desc id="d4">증상(앞쪽 층만 안 배움)에서 시작해 원인 가설(기울기 소실)을 세우고, 층별 gradient를 측정해 확인한 뒤, ReLU와 He 초기화로 해결하고, 다시 측정해 개선을 확인한다.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
    .bg{fill:#fcfcfb;stroke:rgba(11,11,11,.10)}
    .ttl{fill:#0b0b0b;font-size:16px;font-weight:700}
    .h{fill:#0b0b0b;font-size:13px;font-weight:700}
    .mut{fill:#898781;font-size:11px}
    .pane{fill:#f4f4f1;stroke:#c3c2b7;stroke-width:1.5}
    .paneBad{fill:#f7ecec;stroke:#d03b3b;stroke-width:1.5}
    .paneOk{fill:#eaf3ec;stroke:#3f8f5a;stroke-width:1.5}
    .ax{stroke:#c3c2b7;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
    .num{fill:#898781;font-size:11px;font-weight:700}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1a1a19;stroke:rgba(255,255,255,.10)}
      .ttl,.h{fill:#ffffff} .mut,.num{fill:#8f8d87}
      .pane{fill:#232322;stroke:#383835}
      .paneBad{fill:#2c2220;stroke:#a83030}
      .paneOk{fill:#1f2a22;stroke:#3f8f5a}
      .ax{stroke:#6b6a64}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/>
    </marker>
  </defs>
  <rect class="bg" x=".5" y=".5" width="719" height="199" rx="10"/>
  <text class="ttl" x="24" y="30">추측에서 멈추지 않는다: 측정, 고치기, 다시 측정</text>

  <text class="num" x="80" y="66" text-anchor="middle">1</text>
  <rect class="paneBad" x="24" y="72" width="112" height="70" rx="8"/>
  <text class="h" x="80" y="96" text-anchor="middle">증상</text>
  <text class="mut" x="80" y="114" text-anchor="middle">앞쪽 층 가중치</text>
  <text class="mut" x="80" y="128" text-anchor="middle">거의 안 변함</text>
  <line class="ax" x1="136" y1="107" x2="162" y2="107"/>

  <text class="num" x="220" y="66" text-anchor="middle">2</text>
  <rect class="pane" x="164" y="72" width="112" height="70" rx="8"/>
  <text class="h" x="220" y="96" text-anchor="middle">원인 가설</text>
  <text class="mut" x="220" y="114" text-anchor="middle">깊음 + Sigmoid</text>
  <text class="mut" x="220" y="128" text-anchor="middle">기울기 소실?</text>
  <line class="ax" x1="276" y1="107" x2="302" y2="107"/>

  <text class="num" x="360" y="66" text-anchor="middle">3</text>
  <rect class="pane" x="304" y="72" width="112" height="70" rx="8"/>
  <text class="h" x="360" y="96" text-anchor="middle">측정</text>
  <text class="mut" x="360" y="114" text-anchor="middle">층별 weight.grad</text>
  <text class="mut" x="360" y="128" text-anchor="middle">크기 출력</text>
  <line class="ax" x1="416" y1="107" x2="442" y2="107"/>

  <text class="num" x="500" y="66" text-anchor="middle">4</text>
  <rect class="paneOk" x="444" y="72" width="112" height="70" rx="8"/>
  <text class="h" x="500" y="96" text-anchor="middle">해결</text>
  <text class="mut" x="500" y="114" text-anchor="middle">ReLU + He 초기화</text>
  <text class="mut" x="500" y="128" text-anchor="middle">(필요시 BN, Residual)</text>
  <line class="ax" x1="556" y1="107" x2="582" y2="107"/>

  <text class="num" x="640" y="66" text-anchor="middle">5</text>
  <rect class="paneOk" x="584" y="72" width="112" height="70" rx="8"/>
  <text class="h" x="640" y="96" text-anchor="middle">재측정</text>
  <text class="mut" x="640" y="114" text-anchor="middle">같은 코드로 다시</text>
  <text class="mut" x="640" y="128" text-anchor="middle">앞쪽 층 살아났나?</text>

  <text class="mut" x="360" y="175" text-anchor="middle">3번에서 입력층으로 갈수록 가파르게 작아지면 가설 확정. 5번에서 차이가 10배 안쪽이면 성공.</text>
</svg>
