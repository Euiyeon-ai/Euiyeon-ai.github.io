<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t3 d3">
  <title id="t3">Sigmoid와 ReLU의 기울기 비교</title>
  <desc id="d3">Sigmoid의 기울기는 최대 0.25이고 입력이 0에서 멀어지면 0에 가까워진다. ReLU는 양수 구간에서 기울기가 항상 1이다. 역전파에서 Sigmoid는 0.2, 0.1, 0.2를 곱해 gradient가 사라지고, ReLU는 1, 1, 1을 곱해 gradient가 앞쪽까지 전달된다.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
    .bg{fill:#fcfcfb;stroke:rgba(11,11,11,.10)}
    .ttl{fill:#0b0b0b;font-size:16px;font-weight:700}
    .h{fill:#0b0b0b;font-size:13px;font-weight:700}
    .sub{fill:#52514e;font-size:12px}
    .mut{fill:#898781;font-size:11px}
    .axis{stroke:#c3c2b7;stroke-width:1.2;fill:none}
    .grid{stroke:#c3c2b7;stroke-width:1;stroke-dasharray:3 3;fill:none}
    .curveBad{stroke:#d03b3b;stroke-width:2.5;fill:none}
    .curveOk{stroke:#3f8f5a;stroke-width:2.5;fill:none}
    .paneBad{fill:#f7ecec;stroke:#d03b3b;stroke-width:1.5}
    .paneOk{fill:#eaf3ec;stroke:#3f8f5a;stroke-width:1.5}
    .bad{fill:#d03b3b;font-size:12px;font-weight:700}
    .good{fill:#3f8f5a;font-size:12px;font-weight:700}
    .mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;fill:#0b0b0b}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1a1a19;stroke:rgba(255,255,255,.10)}
      .ttl,.h,.mono{fill:#ffffff}
      .sub{fill:#c3c2b7} .mut{fill:#8f8d87}
      .axis,.grid{stroke:#6b6a64}
      .paneBad{fill:#2c2220;stroke:#a83030}
      .paneOk{fill:#1f2a22;stroke:#3f8f5a}
    }
  </style>
  <rect class="bg" x=".5" y=".5" width="719" height="359" rx="10"/>
  <text class="ttl" x="24" y="30">Sigmoid는 기울기 최대 0.25, ReLU는 양수에서 1</text>

  <!-- left panel: sigmoid' -->
  <text class="h" x="60" y="60">Sigmoid의 기울기</text>
  <line class="axis" x1="60" y1="200" x2="300" y2="200"/>
  <line class="axis" x1="180" y1="70" x2="180" y2="200"/>
  <line class="grid" x1="60" y1="76.2" x2="300" y2="76.2"/>
  <line class="grid" x1="60" y1="169.0" x2="300" y2="169.0"/>
  <text class="mut" x="304" y="80.2">1</text>
  <text class="mut" x="304" y="173.0">0.25</text>
  <text class="mut" x="180" y="214" text-anchor="middle">x = 0</text>
  <path class="curveBad" d="M60.0,199.7 L62.0,199.7 L64.0,199.6 L66.0,199.6 L68.0,199.5 L70.0,199.5 L72.0,199.4 L74.0,199.4 L76.0,199.3 L78.0,199.3 L80.0,199.2 L82.0,199.1 L84.0,199.0 L86.0,198.9 L88.0,198.8 L90.0,198.7 L92.0,198.5 L94.0,198.4 L96.0,198.2 L98.0,198.0 L100.0,197.8 L102.0,197.6 L104.0,197.4 L106.0,197.1 L108.0,196.8 L110.0,196.5 L112.0,196.1 L114.0,195.8 L116.0,195.3 L118.0,194.9 L120.0,194.4 L122.0,193.9 L124.0,193.3 L126.0,192.7 L128.0,192.0 L130.0,191.3 L132.0,190.6 L134.0,189.7 L136.0,188.9 L138.0,188.0 L140.0,187.0 L142.0,186.0 L144.0,184.9 L146.0,183.8 L148.0,182.7 L150.0,181.5 L152.0,180.4 L154.0,179.2 L156.0,178.0 L158.0,176.8 L160.0,175.7 L162.0,174.6 L164.0,173.5 L166.0,172.5 L168.0,171.7 L170.0,170.9 L172.0,170.3 L174.0,169.7 L176.0,169.4 L178.0,169.1 L180.0,169.0 L182.0,169.1 L184.0,169.4 L186.0,169.7 L188.0,170.3 L190.0,170.9 L192.0,171.7 L194.0,172.5 L196.0,173.5 L198.0,174.6 L200.0,175.7 L202.0,176.8 L204.0,178.0 L206.0,179.2 L208.0,180.4 L210.0,181.5 L212.0,182.7 L214.0,183.8 L216.0,184.9 L218.0,186.0 L220.0,187.0 L222.0,188.0 L224.0,188.9 L226.0,189.7 L228.0,190.6 L230.0,191.3 L232.0,192.0 L234.0,192.7 L236.0,193.3 L238.0,193.9 L240.0,194.4 L242.0,194.9 L244.0,195.3 L246.0,195.8 L248.0,196.1 L250.0,196.5 L252.0,196.8 L254.0,197.1 L256.0,197.4 L258.0,197.6 L260.0,197.8 L262.0,198.0 L264.0,198.2 L266.0,198.4 L268.0,198.5 L270.0,198.7 L272.0,198.8 L274.0,198.9 L276.0,199.0 L278.0,199.1 L280.0,199.2 L282.0,199.3 L284.0,199.3 L286.0,199.4 L288.0,199.4 L290.0,199.5 L292.0,199.5 L294.0,199.6 L296.0,199.6 L298.0,199.7 L300.0,199.7"/>
  <text class="bad" x="180" y="161.0" text-anchor="middle">최대 0.25</text>
  <text class="mut" x="70" y="194.0">x가 크거나 작으면 ≈ 0</text>

  <!-- right panel: relu' -->
  <text class="h" x="400" y="60">ReLU의 기울기</text>
  <line class="axis" x1="400" y1="200" x2="640" y2="200"/>
  <line class="axis" x1="520" y1="70" x2="520" y2="200"/>
  <line class="grid" x1="400" y1="76.2" x2="640" y2="76.2"/>
  <text class="mut" x="644" y="80.2">1</text>
  <text class="mut" x="520" y="214" text-anchor="middle">x = 0</text>
  <path class="curveOk" d="M400.0,200.0 L520.0,200.0 M520.0,76.2 L640.0,76.2"/>
  <text class="good" x="580" y="68.2" text-anchor="middle">x &gt; 0 이면 항상 1</text>
  <text class="mut" x="410" y="194.0">x ≤ 0 이면 0</text>

  <!-- bottom: chain -->
  <rect class="paneBad" x="24" y="236" width="330" height="100" rx="8"/>
  <text class="h" x="40" y="258">Sigmoid로 역전파</text>
  <text class="mono" x="40" y="284">gradient × 0.2 × 0.1 × 0.2 × ...</text>
  <text class="bad" x="40" y="310">→ 점점 사라짐 (20층이면 약 10⁻¹²)</text>

  <rect class="paneOk" x="366" y="236" width="330" height="100" rx="8"/>
  <text class="h" x="382" y="258">ReLU(양수 구간)로 역전파</text>
  <text class="mono" x="382" y="284">gradient × 1 × 1 × 1 × ...</text>
  <text class="good" x="382" y="310">→ 앞쪽 층까지 그대로 전달</text>
</svg>