    <rect class="cap" x="240" y="122" width="20" height="8" rx="2"/>
    <rect class="gap" x="280" y="116" width="30" height="46" rx="4"/>
    <line class="board" x1="47" y1="234" x2="321" y2="234"/>
    <rect class="water" x="55" y="182" width="30" height="50" rx="8"/>
    <rect class="cap" x="60" y="188" width="20" height="8" rx="2"/>
    <rect class="water" x="100" y="182" width="30" height="50" rx="8"/>
    <rect class="cap" x="105" y="188" width="20" height="8" rx="2"/>
    <rect class="water" x="145" y="182" width="30" height="50" rx="8"/>
    <rect class="cap" x="150" y="188" width="20" height="8" rx="2"/>
    <rect class="water" x="190" y="182" width="30" height="50" rx="8"/>
    <rect class="cap" x="195" y="188" width="20" height="8" rx="2"/>
    <rect class="water" x="235" y="182" width="30" height="50" rx="8"/>
    <rect class="cap" x="240" y="188" width="20" height="8" rx="2"/>
    <rect class="gap" x="280" y="186" width="30" height="46" rx="4"/>
  </g>
  <rect class="out" x="32" y="262" width="304" height="68" rx="6"/>
  <text class="outT" x="44" y="284">출력 : "음료 진열대" (0.97)</text>
  <text class="bad" x="44" y="306">✗ 몇 개?   ✗ 어디에?   ✗ 빈 칸은?</text>
  <text class="mut" x="44" y="323">콜라가 3개든 30개든 같은 답</text>

  <rect class="panel" x="368" y="62" width="336" height="282" rx="8"/>
  <text class="h" x="384" y="86">객체 인식 (탐지)</text>
  <text class="sub" x="492" y="86">상품마다 박스 + 종류 + 점수</text>
  <g>
    <rect class="shelf" x="391" y="98" width="290" height="150" rx="6"/>
    <line class="board" x1="399" y1="164" x2="673" y2="164"/>
    <rect class="cola" x="407" y="116" width="30" height="46" rx="5"/>
    <rect class="cap" x="412" y="122" width="20" height="8" rx="2"/>
    <rect class="bxC" x="404" y="113" width="36" height="52" rx="2"/>
    <rect class="cola" x="452" y="116" width="30" height="46" rx="5"/>
    <rect class="cap" x="457" y="122" width="20" height="8" rx="2"/>
    <rect class="bxC" x="449" y="113" width="36" height="52" rx="2"/>
    <rect class="cola" x="497" y="116" width="30" height="46" rx="5"/>
    <rect class="cap" x="502" y="122" width="20" height="8" rx="2"/>
    <rect class="bxC" x="494" y="113" width="36" height="52" rx="2"/>
    <rect class="gap" x="542" y="116" width="30" height="46" rx="4"/>
    <rect class="cider" x="587" y="116" width="30" height="46" rx="5"/>
    <rect class="cap" x="592" y="122" width="20" height="8" rx="2"/>
    <rect class="bxS" x="584" y="113" width="36" height="52" rx="2"/>
    <rect class="gap" x="632" y="116" width="30" height="46" rx="4"/>
    <line class="board" x1="399" y1="234" x2="673" y2="234"/>
    <rect class="water" x="407" y="182" width="30" height="50" rx="8"/>
    <rect class="cap" x="412" y="188" width="20" height="8" rx="2"/>
    <rect class="bxW" x="404" y="179" width="36" height="56" rx="2"/>
    <rect class="water" x="452" y="182" width="30" height="50" rx="8"/>
    <rect class="cap" x="457" y="188" width="20" height="8" rx="2"/>
    <rect class="bxW" x="449" y="179" width="36" height="56" rx="2"/>
    <rect class="water" x="497" y="182" width="30" height="50" rx="8"/>
    <rect class="cap" x="502" y="188" width="20" height="8" rx="2"/>
    <rect class="bxW" x="494" y="179" width="36" height="56" rx="2"/>
    <rect class="water" x="542" y="182" width="30" height="50" rx="8"/>
    <rect class="cap" x="547" y="188" width="20" height="8" rx="2"/>
    <rect class="bxW" x="539" y="179" width="36" height="56" rx="2"/>
    <rect class="water" x="587" y="182" width="30" height="50" rx="8"/>
    <rect class="cap" x="592" y="188" width="20" height="8" rx="2"/>
    <rect class="bxW" x="584" y="179" width="36" height="56" rx="2"/>
    <rect class="gap" x="632" y="186" width="30" height="46" rx="4"/>
  </g>
  <rect class="out" x="384" y="262" width="304" height="68" rx="6"/>
  <text class="outT num" x="396" y="284">출력 9개 : 콜라 3 · 사이다 1 · 생수 5</text>
  <text class="good" x="396" y="306">✓ 개수 = 박스 수   ✓ 위치 = 박스 좌표</text>
  <text class="mut" x="396" y="323">빈 칸 3 = 박스 사이의 빈 간격으로 찾음</text>
</svg>
