baseURL = "https://euiyeon-ai.github.io/"
title = "Euiyeon 블로그"
theme = "PaperMod"

locale = "ko-kr"
defaultContentLanguage = "ko"
hasCJKLanguage = true

enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = false
summaryLength = 40

# 글 주소 = /posts/<slug>/ 로 고정
[permalinks]
  posts = "/posts/:slug/"

[pagination]
  pagerSize = 10

# 검색 기능에 필요한 JSON 인덱스 생성
[outputs]
  home = ["HTML", "RSS", "JSON"]

[minify]
  disableXML = true

[params]
  env = "production"
  title = "Euiyeon 블로그"
  description = "코드잇 AI 엔지니어 과정에서 공부한 내용을 기록하는 블로그"
  author = "Euiyeon"
  defaultTheme = "auto"          # auto | light | dark
  DateFormat = "2006-01-02"

  ShowReadingTime = true
  ShowWordCount = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowShareButtons = false
  ShowRssButtonInSectionTermList = true
  disableScrollToTop = false
  hideMeta = false

  ShowToc = true
  TocOpen = false

  [params.homeInfoParams]
    Title = "안녕하세요, Euiyeon입니다 👋"
    Content = """
코드잇 AI 엔지니어 과정에서 **공부한 내용을 기록**하는 공간입니다.

- 📝 **위클리페이퍼** — 매주 받은 질문에 답하며 정리한 글
- 🎤 **스터디 발표** — 스터디에서 발표한 내용을 다시 풀어 쓴 글
- 🔎 **태그 · 검색** — 주제별로 찾아보기
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Euiyeon-ai"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[[menu.main]]
  identifier = "codeit"
  name = "코드잇(AI 엔지니어)"
  weight = 10

[[menu.main]]
  parent = "codeit"
  name = "위클리페이퍼"
  pageRef = "/tags/위클리페이퍼"
  weight = 1

[[menu.main]]
  parent = "codeit"
  name = "스터디 발표"
  pageRef = "/tags/스터디 발표"
  weight = 2

[[menu.main]]
  identifier = "archives"
  name = "아카이브"
  url = "/archives/"
  weight = 20

[[menu.main]]
  identifier = "tags"
  name = "태그"
  url = "/tags/"
  weight = 30

[[menu.main]]
  identifier = "search"
  name = "검색"
  url = "/search/"
  weight = 40

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
