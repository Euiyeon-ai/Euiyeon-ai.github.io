<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180" role="img" aria-labelledby="t1 d1">
  <title id="t1">20층 시그모이드에서 gradient가 사라지는 과정</title>
  <desc id="d1">출력층에서 출발한 gradient가 입력층으로 거슬러 올라가며 층마다 0.25 이하를 곱해 줄어든다. 20번 곱하면 거의 0이 되어 입력층까지 도착하지 못한다.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
    .bg{fill:#fcfcfb;stroke:rgba(11,11,11,.10)}
    .ttl{fill:#0b0b0b;font-size:16px;font-weight:700}
    .h{fill:#0b0b0b;font-size:13px;font-weight:700}
    .sub{fill:#52514e;font-size:12px}
    .mut{fill:#898781;font-size:11.5px}
    .layer{fill:#f4f4f1;stroke:#c3c2b7;stroke-width:1.5}
    .layerDead{fill:#f7ecec;stroke:#d03b3b;stroke-width:1.5}
    .layerOk{fill:#eaf3ec;stroke:#3f8f5a;stroke-width:1.5}
    .ax{stroke:#c3c2b7;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
    .bad{fill:#d03b3b;font-size:12px;font-weight:700}
    .good{fill:#3f8f5a;font-size:12px;font-weight:700}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1a1a19;stroke:rgba(255,255,255,.10)}
      .ttl,.h{fill:#ffffff}
      .sub{fill:#c3c2b7}
      .mut{fill:#8f8d87}
      .layer{fill:#232322;stroke:#383835}
      .layerDead{fill:#2c2220;stroke:#a83030}
      .layerOk{fill:#1f2a22;stroke:#3f8f5a}
      .ax{stroke:#6b6a64}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/>
    </marker>
  </defs>
  <rect class="bg" x=".5" y=".5" width="719" height="179" rx="10"/>
  <text class="ttl" x="24" y="30">층을 하나 거슬러 올라갈 때마다 신호가 1/4 이하로 줄어든다</text>
  <text class="sub" x="24" y="50">역전파 방향: 출력층에서 입력층으로 (오른쪽 → 왼쪽)</text>

  <rect class="layerDead" x="40"  y="70" width="80" height="44" rx="8"/>
  <text class="h" x="80" y="88" text-anchor="middle">1층</text>
  <text class="mut" x="80" y="104" text-anchor="middle">입력 쪽</text>
  <rect class="layerDead" x="150" y="70" width="80" height="44" rx="8"/>
  <text class="h" x="190" y="88" text-anchor="middle">5층</text>
  <rect class="layer" x="260" y="70" width="80" height="44" rx="8"/>
  <text class="h" x="300" y="88" text-anchor="middle">10층</text>
  <rect class="layer" x="370" y="70" width="80" height="44" rx="8"/>
  <text class="h" x="410" y="88" text-anchor="middle">15층</text>
  <rect class="layerOk" x="480" y="70" width="80" height="44" rx="8"/>
  <text class="h" x="520" y="88" text-anchor="middle">20층</text>
  <rect class="layerOk" x="590" y="70" width="90" height="44" rx="8"/>
  <text class="h" x="635" y="88" text-anchor="middle">출력층</text>
  <text class="mut" x="635" y="104" text-anchor="middle">loss</text>

  <line class="ax" x1="590" y1="92" x2="562" y2="92"/>
  <line class="ax" x1="480" y1="92" x2="452" y2="92"/>
  <line class="ax" x1="370" y1="92" x2="342" y2="92"/>
  <line class="ax" x1="260" y1="92" x2="232" y2="92"/>
  <line class="ax" x1="150" y1="92" x2="122" y2="92"/>
  <text class="mut" x="575" y="130" text-anchor="middle">x 1/4</text>
  <text class="mut" x="465" y="130" text-anchor="middle">x 1/4</text>
  <text class="mut" x="355" y="130" text-anchor="middle">x 1/4</text>
  <text class="mut" x="245" y="130" text-anchor="middle">x 1/4</text>
  <text class="mut" x="135" y="130" text-anchor="middle">x 1/4</text>

  <text class="bad" x="80" y="160" text-anchor="middle">gradient 거의 0 → 멈춤</text>
  <text class="good" x="600" y="160" text-anchor="middle">gradient 정상 → 잘 배움</text>
</svg>
