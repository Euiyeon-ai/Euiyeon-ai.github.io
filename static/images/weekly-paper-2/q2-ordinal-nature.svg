<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="t4 d4">
  <title id="t4">별점은 숫자와 이름표의 중간이다</title>
  <desc id="d4">회귀는 1에서 5까지 순서도 있고 간격도 일정하다고 가정하고, 분류는 순서도 간격도 없는 별개의 이름표로 본다. 실제 별점은 순서는 있지만 4점에서 5점 사이의 문턱이 유독 높아 간격이 일정하지 않다. 이런 데이터를 순서형이라 부르며 두 방식 사이에 답이 있다.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
    .bg{fill:#fcfcfb;stroke:rgba(11,11,11,.10)}
    .ttl{fill:#0b0b0b;font-size:16px;font-weight:700}
    .h{fill:#0b0b0b;font-size:14px;font-weight:700}
    .lbl{fill:#0b0b0b;font-size:13px;font-variant-numeric:tabular-nums}
    .sub{fill:#52514e;font-size:12.5px}
    .mut{fill:#898781;font-size:12px}
    .node{fill:#f4f4f1;stroke:#c3c2b7;stroke-width:1.5}
    .nodeOk{fill:#e8f5e8;stroke:#0ca30c;stroke-width:2}
    .rail{stroke:#c3c2b7;stroke-width:2}
    .div{stroke:#e1e0d9;stroke-width:1.5}
    .bad{fill:#d03b3b}
    .good{fill:#006300}
    .tick{stroke:#898781;stroke-width:1.2;stroke-dasharray:3 3}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1a1a19;stroke:rgba(255,255,255,.10)}
      .ttl,.h,.lbl{fill:#ffffff}
      .sub{fill:#c3c2b7}
      .node{fill:#232322;stroke:#383835}
      .nodeOk{fill:#122b12;stroke:#0ca30c}
      .rail{stroke:#4d4d49}
      .div{stroke:#2c2c2a}
      .good{fill:#0ca30c}
    }
  </style>
  <rect class="bg" x=".5" y=".5" width="719" height="319" rx="10"/>
  <text class="ttl" x="24" y="30">1~5점은 숫자인가 이름표인가</text>

  <!-- ── 회귀의 가정 ── -->
  <text class="h" x="24" y="66">회귀의 가정 — 완전한 숫자</text>
  <text class="mut" x="500" y="66">순서 O · 등간격 O</text>
  <line class="rail" x1="60" y1="94" x2="620" y2="94"/>
  <g>
    <circle class="node" cx="60"  cy="94" r="15"/><text class="lbl" x="60"  y="99" text-anchor="middle">1</text>
    <circle class="node" cx="200" cy="94" r="15"/><text class="lbl" x="200" y="99" text-anchor="middle">2</text>
    <circle class="node" cx="340" cy="94" r="15"/><text class="lbl" x="340" y="99" text-anchor="middle">3</text>
    <circle class="node" cx="480" cy="94" r="15"/><text class="lbl" x="480" y="99" text-anchor="middle">4</text>
    <circle class="node" cx="620" cy="94" r="15"/><text class="lbl" x="620" y="99" text-anchor="middle">5</text>
  </g>
  <text class="sub bad" x="24" y="128">✕ 4→5가 2→3보다 어렵다는 사실을 반영 못 함</text>

  <line class="div" x1="24" y1="146" x2="696" y2="146"/>

  <!-- ── 분류의 가정 ── -->
  <text class="h" x="24" y="176">분류의 가정 — 서로 무관한 이름표</text>
  <text class="mut" x="500" y="176">순서 X · 등간격 X</text>
  <g>
    <rect class="node" x="45"  y="192" width="60" height="34" rx="8"/><text class="lbl" x="75"  y="214" text-anchor="middle">1점</text>
    <rect class="node" x="185" y="192" width="60" height="34" rx="8"/><text class="lbl" x="215" y="214" text-anchor="middle">2점</text>
    <rect class="node" x="325" y="192" width="60" height="34" rx="8"/><text class="lbl" x="355" y="214" text-anchor="middle">3점</text>
    <rect class="node" x="465" y="192" width="60" height="34" rx="8"/><text class="lbl" x="495" y="214" text-anchor="middle">4점</text>
    <rect class="node" x="605" y="192" width="60" height="34" rx="8"/><text class="lbl" x="635" y="214" text-anchor="middle">5점</text>
  </g>
  <text class="sub bad" x="24" y="248">✕ 연결선이 없다 = 1점을 5점이라 해도 2점이라 한 것과 같은 벌점</text>

  <line class="div" x1="24" y1="264" x2="696" y2="264"/>

  <!-- ── 실제 ── -->
  <text class="h good" x="24" y="292">실제 별점 — 순서형(ordinal)</text>
  <line class="rail" x1="330" y1="292" x2="470" y2="292"/>
  <line class="rail" x1="470" y1="292" x2="672" y2="292" stroke-dasharray="0"/>
  <g>
    <circle class="nodeOk" cx="330" cy="292" r="13"/><text class="lbl" x="330" y="297" text-anchor="middle">3</text>
    <circle class="nodeOk" cx="470" cy="292" r="13"/><text class="lbl" x="470" y="297" text-anchor="middle">4</text>
    <circle class="nodeOk" cx="672" cy="292" r="13"/><text class="lbl" x="672" y="297" text-anchor="middle">5</text>
  </g>
  <text class="mut" x="400" y="312" text-anchor="middle">좁은 간격</text>
  <text class="mut" x="571" y="312" text-anchor="middle">넓은 간격 (5점은 드물다)</text>
  <text class="sub good" x="24" y="312">순서 O · 등간격 X</text>
</svg>
