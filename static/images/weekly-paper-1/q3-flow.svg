<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 790" width="720" height="790" role="img" aria-labelledby="t4 d4">
  <title id="t4">두 팀 데이터 병합 순서</title>
  <desc id="d4">A팀·B팀 데이터를 기준 확인, 중복 정리, 합치기, 결측치 처리, 검증 순으로 병합한다. 중복 정리는 합치기 전에, 결측치 처리는 합친 뒤에 둔다.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
    .bg{fill:#fcfcfb;stroke:rgba(11,11,11,.10)}
    .box{fill:#f4f4f1;stroke:#c3c2b7;stroke-width:1.5}
    .boxW{fill:#eef5fd;stroke:#2a78d6;stroke-width:2}
    .boxD{fill:#fdefe8;stroke:#eb6834;stroke-width:2}
    .h{fill:#0b0b0b;font-size:15px;font-weight:700}
    .lbl{fill:#0b0b0b;font-size:13px}
    .sub{fill:#52514e;font-size:12.5px}
    .mut{fill:#898781;font-size:12px}
    .fl{stroke:#c3c2b7;stroke-width:1.8;fill:none}
    .arh{fill:#c3c2b7}
    .pillD{fill:#fdefe8;stroke:#eb6834;stroke-width:1.5}
    .pillW{fill:#eef5fd;stroke:#2a78d6;stroke-width:1.5}
    .tagD{fill:#b8430f;font-size:12.5px;font-weight:700}
    .tagW{fill:#1c5cab;font-size:12.5px;font-weight:700}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1a1a19;stroke:rgba(255,255,255,.10)}
      .box{fill:#232322;stroke:#383835}
      .boxW{fill:#16283c;stroke:#3987e5}
      .boxD{fill:#33200f;stroke:#d95926}
      .h,.lbl{fill:#ffffff}
      .sub{fill:#c3c2b7}
      .fl{stroke:#383835}
      .arh{fill:#383835}
      .pillD{fill:#33200f;stroke:#d95926}
      .pillW{fill:#16283c;stroke:#3987e5}
      .tagD{fill:#f2a583}
      .tagW{fill:#86b6ef}
    }
  </style>
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arh" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x=".5" y=".5" width="719" height="789" rx="10"/>

  <!-- 원본 두 개 -->
  <rect class="box" x="100" y="44" width="210" height="70" rx="8"/>
  <text class="h" x="205" y="70" text-anchor="middle">A팀 데이터</text>
  <text class="sub" x="205" y="90" text-anchor="middle">ID: C001 · 1,200행</text>
  <text class="mut" x="205" y="107" text-anchor="middle">빈칸·중복 있음</text>

  <rect class="box" x="410" y="44" width="210" height="70" rx="8"/>
  <text class="h" x="515" y="70" text-anchor="middle">B팀 데이터</text>
  <text class="sub" x="515" y="90" text-anchor="middle">ID: 001 · 900행</text>
  <text class="mut" x="515" y="107" text-anchor="middle">빈칸·중복 있음</text>

  <path class="fl" d="M205,114 V136 H515 V114"/>
  <path class="fl" d="M360,136 V156" marker-end="url(#a4)"/>

  <!-- ① 기준 확인 -->
  <rect class="box" x="130" y="158" width="460" height="86" rx="8"/>
  <text class="h" x="152" y="184">① 기준 확인</text>
  <text class="sub" x="152" y="206">· ID 형식 통일 — 001 → C001</text>
  <text class="sub" x="152" y="228">· 컬럼 의미 대조('구매액'이 누적인가?) · 각 데이터 상태 따로 기록</text>

  <path class="fl" d="M360,244 V266 M205,266 H515"/>
  <path class="fl" d="M205,266 V286" marker-end="url(#a4)"/>
  <path class="fl" d="M515,266 V286" marker-end="url(#a4)"/>

  <!-- ② 중복 정리 -->
  <rect class="boxD" x="100" y="288" width="210" height="76" rx="8"/>
  <text class="h" x="205" y="316" text-anchor="middle">② 중복 정리</text>
  <text class="sub" x="205" y="340" text-anchor="middle">1,200행 → 1,050행</text>

  <rect class="boxD" x="410" y="288" width="210" height="76" rx="8"/>
  <text class="h" x="515" y="316" text-anchor="middle">② 중복 정리</text>
  <text class="sub" x="515" y="340" text-anchor="middle">900행 → 880행</text>

  <path class="fl" d="M205,364 V396 H515 V364"/>
  <rect class="pillD" x="238" y="368" width="244" height="26" rx="13"/>
  <text class="tagD" x="360" y="386" text-anchor="middle">합치기 前 — 행 폭발 방지</text>
  <path class="fl" d="M360,396 V416" marker-end="url(#a4)"/>

  <!-- ③ 합치기 -->
  <rect class="box" x="130" y="418" width="460" height="76" rx="8"/>
  <text class="h" x="152" y="444">③ 합치기 — outer join → 1,180행</text>
  <text class="sub" x="152" y="470">행 수가 예상보다 많으면 ②가 덜 끝난 것이다</text>

  <path class="fl" d="M360,494 V518" marker-end="url(#a4)"/>

  <!-- ④ 결측치 처리 -->
  <rect class="boxW" x="130" y="520" width="460" height="86" rx="8"/>
  <text class="h" x="152" y="546">④ 결측치 처리</text>
  <text class="sub" x="152" y="568">1) 상대 팀 값으로 먼저 메운다</text>
  <text class="sub" x="152" y="590">2) 그래도 남은 빈칸만 이유별로 처리한다</text>

  <rect class="pillW" x="228" y="614" width="264" height="26" rx="13"/>
  <text class="tagW" x="360" y="632" text-anchor="middle">합친 後 — 진짜 값 살리기</text>
  <path class="fl" d="M360,606 V614 M360,640 V660" marker-end="url(#a4)"/>

  <!-- ⑤ 검증 -->
  <rect class="box" x="130" y="662" width="460" height="72" rx="8"/>
  <text class="h" x="152" y="688">⑤ 검증</text>
  <text class="sub" x="152" y="712">고객 수 · 중복 ID · 결측 수 · 매출 합계를 원본과 대조</text>

  <path class="fl" d="M360,734 V754" marker-end="url(#a4)"/>
  <text class="h" x="360" y="774" text-anchor="middle">최종 통합 테이블</text>
</svg>
