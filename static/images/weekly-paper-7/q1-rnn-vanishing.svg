<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" width="720" height="190" role="img" aria-labelledby="t1 d1">
  <title id="t1">RNN에서 고치라는 신호가 문장 맨 앞까지 못 가는 과정</title>
  <desc id="d1">문장 끝에서 계산한 loss의 gradient가 시간축을 거슬러 올라가며 매 칸 1보다 작은 비율이 곱해져 줄어든다. 100칸을 지나면 거의 0이 되어 맨 앞 단어를 처리한 가중치는 고쳐지지 않는다.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
    .bg{fill:#fcfcfb;stroke:rgba(11,11,11,.10)}
    .ttl{fill:#0b0b0b;font-size:16px;font-weight:700}
    .h{fill:#0b0b0b;font-size:13px;font-weight:700}
    .sub{fill:#52514e;font-size:12px}
    .mut{fill:#898781;font-size:11.5px}
    .layer{fill:#f4f4f1;stroke:#c3c2b7;stroke-width:1.5}
    .layerDead{fill:#f7ecec;stroke:#d03b3b;stroke-width:1.5}
    .layerOk{fill:#eaf3ec;stroke:#3f8f5a;stroke-width:1.5}
    .ax{stroke:#c3c2b7;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
    .bad{fill:#d03b3b;font-size:12px;font-weight:700}
    .good{fill:#3f8f5a;font-size:12px;font-weight:700}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1a1a19;stroke:rgba(255,255,255,.10)}
      .ttl,.h{fill:#ffffff}
      .sub{fill:#c3c2b7}
      .mut{fill:#8f8d87}
      .layer{fill:#232322;stroke:#383835}
      .layerDead{fill:#2c2220;stroke:#a83030}
      .layerOk{fill:#1f2a22;stroke:#3f8f5a}
      .ax{stroke:#6b6a64}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/>
    </marker>
  </defs>
  <rect class="bg" x=".5" y=".5" width="719" height="189" rx="10"/>
  <text class="ttl" x="24" y="30">"고쳐!" 신호는 문장 끝에서 출발해 한 칸 거슬러 갈 때마다 줄어든다</text>
  <text class="sub" x="24" y="50">역전파 방향: 문장 끝 → 문장 앞 (오른쪽 → 왼쪽). 같은 W를 매 칸 거꾸로 한 번씩 통과</text>

  <rect class="layerDead" x="40"  y="70" width="80" height="44" rx="8"/>
  <text class="h" x="80" y="88" text-anchor="middle">"최고의"</text>
  <text class="mut" x="80" y="104" text-anchor="middle">1번째 단어</text>
  <rect class="layerDead" x="150" y="70" width="80" height="44" rx="8"/>
  <text class="h" x="190" y="88" text-anchor="middle">"영화"</text>
  <text class="mut" x="190" y="104" text-anchor="middle">2번째</text>
  <rect class="layer" x="260" y="70" width="80" height="44" rx="8"/>
  <text class="h" x="300" y="88" text-anchor="middle">…</text>
  <text class="mut" x="300" y="104" text-anchor="middle">50번째</text>
  <rect class="layer" x="370" y="70" width="80" height="44" rx="8"/>
  <text class="h" x="410" y="88" text-anchor="middle">…</text>
  <text class="mut" x="410" y="104" text-anchor="middle">99번째</text>
  <rect class="layerOk" x="480" y="70" width="80" height="44" rx="8"/>
  <text class="h" x="520" y="88" text-anchor="middle">"였다."</text>
  <text class="mut" x="520" y="104" text-anchor="middle">100번째</text>
  <rect class="layerOk" x="590" y="70" width="90" height="44" rx="8"/>
  <text class="h" x="635" y="88" text-anchor="middle">긍정 / 부정</text>
  <text class="mut" x="635" y="104" text-anchor="middle">loss</text>

  <line class="ax" x1="590" y1="92" x2="562" y2="92"/>
  <line class="ax" x1="480" y1="92" x2="452" y2="92"/>
  <line class="ax" x1="370" y1="92" x2="342" y2="92"/>
  <line class="ax" x1="260" y1="92" x2="232" y2="92"/>
  <line class="ax" x1="150" y1="92" x2="122" y2="92"/>
  <text class="mut" x="465" y="130" text-anchor="middle">x 0.9</text>
  <text class="mut" x="355" y="130" text-anchor="middle">x 0.9 … x 0.9</text>
  <text class="mut" x="245" y="130" text-anchor="middle">x 0.9 … x 0.9</text>
  <text class="mut" x="135" y="130" text-anchor="middle">x 0.9</text>

  <text class="bad" x="40" y="165">맨 앞: gradient 거의 0 → "최고의"를 어떻게 넘길지 못 배움</text>
  <text class="good" x="680" y="165" text-anchor="end">문장 끝: gradient 정상</text>
</svg>
