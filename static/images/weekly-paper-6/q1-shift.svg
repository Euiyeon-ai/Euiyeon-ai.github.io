<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t3 d3">
  <title id="t3">고양이가 왼쪽에서 오른쪽으로 옮겨갔을 때 FC와 CNN의 반응</title>
  <desc id="d3">위: 완전연결층은 왼쪽 픽셀에 연결된 가중치만 고양이를 배웠기 때문에, 고양이가 오른쪽으로 가면 배운 적 없는 가중치가 처리해 예측이 흔들린다. 아래: 합성곱층은 같은 필터를 사진 전체에 쓰기 때문에, 고양이가 어디 있든 특징 맵의 반응이 같이 이동할 뿐 같은 특징을 찾아낸다.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
    .bg{fill:#fcfcfb;stroke:rgba(11,11,11,.10)}
    .ttl{fill:#0b0b0b;font-size:16px;font-weight:700}
    .h{fill:#0b0b0b;font-size:13px;font-weight:700}
    .sub{fill:#52514e;font-size:12px}
    .mut{fill:#898781;font-size:11.5px}
    .px{fill:#f4f4f1;stroke:#c3c2b7;stroke-width:1}
    .cat{fill:#52514e}
    .wTrained{stroke:#2a78d6;stroke-width:2}
    .wUntrained{stroke:#c3c2b7;stroke-width:1.5;stroke-dasharray:3 3}
    .node{fill:#f4f4f1;stroke:#c3c2b7;stroke-width:1.5}
    .fmOff{fill:#f4f4f1;stroke:#c3c2b7;stroke-width:1}
    .fmOn{fill:#eb6834;stroke:#eb6834;stroke-width:1}
    .fc{fill:#2a78d6;font-size:12.5px;font-weight:700}
    .cnn{fill:#eb6834;font-size:12.5px;font-weight:700}
    .bad{fill:#2a78d6;font-size:12px;font-weight:700}
    .good{fill:#eb6834;font-size:12px;font-weight:700}
    .arr{stroke:#c3c2b7;stroke-width:1.6;fill:none;marker-end:url(#ar)}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1a1a19;stroke:rgba(255,255,255,.10)}
      .ttl,.h{fill:#ffffff}
      .sub{fill:#c3c2b7}
      .mut{fill:#8f8d87}
      .px,.node,.fmOff{fill:#232322;stroke:#383835}
      .cat{fill:#c3c2b7}
      .wTrained{stroke:#3987e5}
      .wUntrained{stroke:#6b6a64}
      .fmOn{fill:#d95926;stroke:#d95926}
      .fc,.bad{fill:#3987e5}
      .cnn,.good{fill:#d95926}
      .arr{stroke:#6b6a64}
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/>
    </marker>
    <!-- simple cat glyph: head + two ears, 24px wide -->
    <g id="catg">
      <path class="cat" d="M0,10 L4,0 L9,7 L15,7 L20,0 L24,10 L24,20 Q24,28 12,28 Q0,28 0,20 Z"/>
    </g>
  </defs>
  <rect class="bg" x=".5" y=".5" width="759" height="329" rx="10"/>
  <text class="ttl" x="24" y="30">학습 때는 왼쪽, 새 사진은 오른쪽 — 같은 고양이인데</text>

  <!-- ===== ROW 1: FC ===== -->
  <text class="fc" x="24" y="68">완전연결(FC)</text>
  <text class="mut" x="24" y="84">위치마다 다른 가중치</text>

  <!-- left image (train) -->
  <text class="mut" x="200" y="60" text-anchor="middle">학습 사진</text>
  <g>
    <rect class="px" x="140" y="68" width="30" height="30"/><rect class="px" x="170" y="68" width="30" height="30"/><rect class="px" x="200" y="68" width="30" height="30"/><rect class="px" x="230" y="68" width="30" height="30"/>
  </g>
  <use href="#catg" x="143" y="70"/>
  <!-- wires from 4 pixels to node at (330,83): first trained, others untrained -->
  <line class="wTrained" x1="170" y1="98" x2="320" y2="83"/>
  <line class="wUntrained" x1="200" y1="98" x2="320" y2="83"/>
  <line class="wUntrained" x1="230" y1="98" x2="320" y2="83"/>
  <line class="wUntrained" x1="260" y1="98" x2="320" y2="83"/>
  <circle class="node" cx="330" cy="83" r="9"/>
  <text class="mut" x="330" y="108" text-anchor="middle">1번 칸 선만 배움</text>

  <!-- right image (test) -->
  <text class="mut" x="500" y="60" text-anchor="middle">새 사진</text>
  <g>
    <rect class="px" x="440" y="68" width="30" height="30"/><rect class="px" x="470" y="68" width="30" height="30"/><rect class="px" x="500" y="68" width="30" height="30"/><rect class="px" x="530" y="68" width="30" height="30"/>
  </g>
  <use href="#catg" x="533" y="70"/>
  <line class="wUntrained" x1="470" y1="98" x2="620" y2="83"/>
  <line class="wUntrained" x1="500" y1="98" x2="620" y2="83"/>
  <line class="wUntrained" x1="530" y1="98" x2="620" y2="83"/>
  <line class="wUntrained" x1="560" y1="98" x2="620" y2="83"/>
  <circle class="node" cx="630" cy="83" r="9"/>
  <text class="bad" x="660" y="87">예측 흔들림</text>
  <text class="mut" x="630" y="108" text-anchor="middle">4번 칸 선은 배운 적 없음</text>

  <line class="arr" x1="380" y1="83" x2="420" y2="83"/>

  <!-- divider -->
  <line x1="24" y1="140" x2="736" y2="140" stroke="rgba(128,128,128,.25)" stroke-width="1"/>

  <!-- ===== ROW 2: CNN ===== -->
  <text class="cnn" x="24" y="176">합성곱(CNN)</text>
  <text class="mut" x="24" y="192">같은 필터를 어디서나</text>

  <text class="mut" x="200" y="168" text-anchor="middle">학습 사진</text>
  <g>
    <rect class="px" x="140" y="176" width="30" height="30"/><rect class="px" x="170" y="176" width="30" height="30"/><rect class="px" x="200" y="176" width="30" height="30"/><rect class="px" x="230" y="176" width="30" height="30"/>
  </g>
  <use href="#catg" x="143" y="178"/>
  <!-- filter sliding: same filter glyph over each cell -->
  <text class="mut" x="200" y="228" text-anchor="middle">🔍 → 🔍 → 🔍 → 🔍</text>
  <text class="mut" x="200" y="244" text-anchor="middle">특징 맵</text>
  <g>
    <rect class="fmOn" x="140" y="250" width="30" height="16"/><rect class="fmOff" x="170" y="250" width="30" height="16"/><rect class="fmOff" x="200" y="250" width="30" height="16"/><rect class="fmOff" x="230" y="250" width="30" height="16"/>
  </g>
  <text class="mut" x="200" y="284" text-anchor="middle">1번 칸에서 "귀 발견"</text>

  <line class="arr" x1="380" y1="200" x2="420" y2="200"/>

  <text class="mut" x="500" y="168" text-anchor="middle">새 사진</text>
  <g>
    <rect class="px" x="440" y="176" width="30" height="30"/><rect class="px" x="470" y="176" width="30" height="30"/><rect class="px" x="500" y="176" width="30" height="30"/><rect class="px" x="530" y="176" width="30" height="30"/>
  </g>
  <use href="#catg" x="533" y="178"/>
  <text class="mut" x="500" y="228" text-anchor="middle">🔍 → 🔍 → 🔍 → 🔍</text>
  <text class="mut" x="500" y="244" text-anchor="middle">특징 맵</text>
  <g>
    <rect class="fmOff" x="440" y="250" width="30" height="16"/><rect class="fmOff" x="470" y="250" width="30" height="16"/><rect class="fmOff" x="500" y="250" width="30" height="16"/><rect class="fmOn" x="530" y="250" width="30" height="16"/>
  </g>
  <text class="mut" x="500" y="284" text-anchor="middle">4번 칸에서 "귀 발견"</text>
  <text class="good" x="600" y="262">같은 특징, 위치만 이동</text>

  <text class="sub" x="380" y="314" text-anchor="middle">FC는 "어느 칸에 있었나"를 외우고, CNN은 "어떤 모양인가"를 외운다</text>
</svg>
