<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t1 d1">
  <title id="t1">이미지 분류와 객체 인식의 출력 비교</title>
  <desc id="d1">같은 진열대 사진에 대해 이미지 분류는 '음료 진열대'라는 라벨 하나만 출력해 개수와 위치를 알 수 없다. 객체 인식은 상품마다 박스와 종류를 출력해 콜라 3개, 사이다 1개, 생수 5개와 각 위치, 그리고 박스가 없는 빈 칸 3곳을 알 수 있다.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    .bg{fill:#fcfcfb;stroke:rgba(11,11,11,.10)}
    .ttl{fill:#0b0b0b;font-size:16px;font-weight:700}
    .h{fill:#0b0b0b;font-size:13.5px;font-weight:700}
    .sub{fill:#52514e;font-size:12px}
    .mut{fill:#898781;font-size:11.5px}
    .panel{fill:none;stroke:#c3c2b7;stroke-width:1;stroke-dasharray:4 4}
    .shelf{fill:#f4f4f1;stroke:#c3c2b7;stroke-width:1.2}
    .board{stroke:#9a988f;stroke-width:3;stroke-linecap:round}
    .gap{fill:none;stroke:#c3c2b7;stroke-width:1.2;stroke-dasharray:3 3}
    .cola{fill:#c8433b}.cider{fill:#3f8f5a}.water{fill:#4a7fc1}
    .cap{fill:#ffffff;opacity:.55}
    .bxC{fill:none;stroke:#c8433b;stroke-width:2}
    .bxS{fill:none;stroke:#3f8f5a;stroke-width:2}
    .bxW{fill:none;stroke:#4a7fc1;stroke-width:2}
    .out{fill:#f4f4f1;stroke:#c3c2b7;stroke-width:1}
    .outT{fill:#0b0b0b;font-size:12.5px;font-weight:600}
    .bad{fill:#d03b3b;font-size:12px;font-weight:700}
    .good{fill:#3f8f5a;font-size:12px;font-weight:700}
    .num{font-variant-numeric:tabular-nums}
    .stage{fill:#f4f4f1;stroke:#c3c2b7;stroke-width:1.2}
    .arr{stroke:#898781;stroke-width:1.5;fill:none}
    .arrh{fill:#898781}
    .dot{fill:#c3c2b7}
    .cand{fill:none;stroke:#e3b071;stroke-width:1}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1a1a19;stroke:rgba(255,255,255,.10)}
      .ttl,.h,.outT{fill:#ffffff}
      .sub{fill:#c3c2b7}
      .mut{fill:#8f8d87}
      .panel{stroke:#383835}
      .shelf,.out,.stage{fill:#232322;stroke:#383835}
      .board{stroke:#6b6a64}
      .gap{stroke:#55534e}
      .dot{fill:#4a4944}
      .cap{fill:#000000;opacity:.25}
    }
  </style>
  <rect class="bg" x=".5" y=".5" width="719" height="359" rx="10"/>
  <text class="ttl" x="24" y="30">같은 진열대 사진, 다른 출력</text>
  <text class="mut" x="24" y="50">점선 칸 = 상품이 빠진 자리</text>

  <rect class="panel" x="16" y="62" width="336" height="282" rx="8"/>
  <text class="h" x="32" y="86">이미지 분류</text>
  <text class="sub" x="122" y="86">사진 1장 → 라벨 1개</text>
  <g>
    <rect class="shelf" x="39" y="98" width="290" height="150" rx="6"/>
    <line class="board" x1="47" y1="164" x2="321" y2="164"/>
    <rect class="cola" x="55" y="116" width="30" height="46" rx="5"/>
    <rect class="cap" x="60" y="122" width="20" height="8" rx="2"/>
    <rect class="cola" x="100" y="116" width="30" height="46" rx="5"/>
    <rect class="cap" x="105" y="122" width="20" height="8" rx="2"/>
