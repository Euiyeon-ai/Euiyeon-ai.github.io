<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img" aria-labelledby="t1 d1">
  <title id="t1">통로가 넓은 오토인코더와 좁은 오토인코더 비교</title>
  <desc id="d1">가운데 통로가 입력만큼 넓으면 오토인코더는 입력을 그대로 흘려보내 복원 오차 0을 만들 수 있어 특징을 배울 이유가 없다. 통로가 좁으면 전부 통과시킬 수 없어서 데이터에 공통된 패턴만 골라 담아야 한다.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
    .bg{fill:#fcfcfb;stroke:rgba(11,11,11,.10)}
    .ttl{fill:#0b0b0b;font-size:16px;font-weight:700}
    .h{fill:#0b0b0b;font-size:13px;font-weight:700}
    .sub{fill:#52514e;font-size:12px}
    .mut{fill:#898781;font-size:11.5px}
    .panel{fill:none;stroke:#c3c2b7;stroke-width:1;stroke-dasharray:4 4}
    .io{fill:#f4f4f1;stroke:#c3c2b7;stroke-width:1.5}
    .encBad{fill:#f7ecec;stroke:#d03b3b;stroke-width:1.5}
    .encOk{fill:#eaf3ec;stroke:#3f8f5a;stroke-width:1.5}
    .bad{fill:#d03b3b;font-size:12px;font-weight:700}
    .good{fill:#3f8f5a;font-size:12px;font-weight:700}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1a1a19;stroke:rgba(255,255,255,.10)}
      .ttl,.h{fill:#ffffff}
      .sub{fill:#c3c2b7}
      .mut{fill:#8f8d87}
      .panel{stroke:#383835}
      .io{fill:#232322;stroke:#383835}
      .encBad{fill:#2c2220;stroke:#a83030}
      .encOk{fill:#1f2a22;stroke:#3f8f5a}
    }
  </style>
  <rect class="bg" x=".5" y=".5" width="719" height="289" rx="10"/>
  <text class="ttl" x="24" y="30">통로가 넓으면 그대로 흘려보내고, 좁으면 골라 담아야 한다</text>

  <!-- left: wide -->
  <rect class="panel" x="24" y="46" width="324" height="226" rx="8"/>
  <text class="h" x="40" y="68">통로가 넓다 (z ≥ 입력)</text>
  <rect class="io" x="50" y="100" width="34" height="100" rx="4"/>
  <polygon class="encBad" points="84,100 152,88 152,212 84,200"/>
  <rect class="encBad" x="152" y="88" width="40" height="124" rx="4"/>
  <polygon class="encBad" points="192,88 260,100 260,200 192,212"/>
  <rect class="io" x="260" y="100" width="34" height="100" rx="4"/>
  <text class="mut" x="67" y="218" text-anchor="middle">입력</text>
  <text class="mut" x="67" y="232" text-anchor="middle">784</text>
  <text class="mut" x="172" y="230" text-anchor="middle">z = 1024</text>
  <text class="mut" x="277" y="218" text-anchor="middle">출력</text>
  <text class="mut" x="277" y="232" text-anchor="middle">784</text>
  <text class="sub" x="118" y="154" text-anchor="middle">그대로</text>
  <text class="sub" x="226" y="154" text-anchor="middle">그대로</text>
  <text class="bad" x="40" y="258">복원 오차 ≈ 0 · 배운 특징 없음 (항등 함수)</text>

  <!-- right: narrow -->
  <rect class="panel" x="372" y="46" width="324" height="226" rx="8"/>
  <text class="h" x="388" y="68">통로가 좁다 (z ≪ 입력)</text>
  <rect class="io" x="398" y="100" width="34" height="100" rx="4"/>
  <polygon class="encOk" points="432,100 500,136 500,164 432,200"/>
  <rect class="encOk" x="500" y="136" width="40" height="28" rx="4"/>
  <polygon class="encOk" points="540,136 608,100 608,200 540,164"/>
  <rect class="io" x="608" y="100" width="34" height="100" rx="4"/>
  <text class="mut" x="415" y="218" text-anchor="middle">입력</text>
  <text class="mut" x="415" y="232" text-anchor="middle">784</text>
  <text class="mut" x="520" y="186" text-anchor="middle">z = 32</text>
  <text class="mut" x="625" y="218" text-anchor="middle">출력</text>
  <text class="mut" x="625" y="232" text-anchor="middle">784</text>
  <text class="sub" x="466" y="92" text-anchor="middle">압축</text>
  <text class="sub" x="574" y="92" text-anchor="middle">복원</text>
  <text class="good" x="388" y="258">복원 오차 &gt; 0 · 공통 패턴만 통과 → 특징 학습</text>
</svg>
