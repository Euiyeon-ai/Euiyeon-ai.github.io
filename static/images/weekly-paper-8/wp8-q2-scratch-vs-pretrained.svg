<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t2 d2">
  <title id="t2">처음부터 학습과 사전학습 모델 빌려 오기 비교</title>
  <desc id="d2">처음부터 학습하면 300장으로 약 1,100만 개의 숫자를 모두 새로 배워야 해서 사진을 외운다. 사전학습 모델을 빌려 오면 선, 모양, 질감을 보는 눈은 이미 배운 상태라 마지막 분류층만 새로 배우면 된다. 수업에서 꽃 1,080장으로 잰 결과 처음부터는 85.7퍼센트, 빌려 온 모델은 98.9퍼센트였다.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
    .bg{fill:#fcfcfb;stroke:rgba(11,11,11,.10)}
    .ttl{fill:#0b0b0b;font-size:16px;font-weight:700}
    .h{fill:#0b0b0b;font-size:13px;font-weight:700}
    .sub{fill:#52514e;font-size:12px}
    .mut{fill:#898781;font-size:11.5px}
    .panel{fill:none;stroke:#c3c2b7;stroke-width:1;stroke-dasharray:4 4}
    .tile{fill:#f4f4f1;stroke:#c3c2b7;stroke-width:1.2}
    .prod{fill:#d9d7d0;stroke:#9a988f;stroke-width:1.2}
    .prodD{fill:#a8a69e;stroke:#77756d;stroke-width:1.2}
    .scr{stroke:#d03b3b;stroke-width:3;stroke-linecap:round}
    .ok{fill:#eaf3ec;stroke:#3f8f5a;stroke-width:1.5}
    .badb{fill:#f7ecec;stroke:#d03b3b;stroke-width:1.5}
    .grey{fill:#eeede8;stroke:#c3c2b7;stroke-width:1.2}
    .arr{stroke:#898781;stroke-width:1.5;fill:none}
    .bad{fill:#d03b3b;font-size:12px;font-weight:700}
    .good{fill:#3f8f5a;font-size:12px;font-weight:700}
    .dotN{fill:#c3c2b7}
    .dotP{fill:#d03b3b}
    .barS{fill:#e3b071}
    .barP{fill:#3f8f5a}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1a1a19;stroke:rgba(255,255,255,.10)}
      .ttl,.h{fill:#ffffff}
      .sub{fill:#c3c2b7}
      .mut{fill:#8f8d87}
      .panel{stroke:#383835}
      .tile,.grey{fill:#232322;stroke:#383835}
      .prod{fill:#4a4944;stroke:#6b6a64}
      .prodD{fill:#2e2d2a;stroke:#4a4944}
      .ok{fill:#1f2a22;stroke:#3f8f5a}
      .badb{fill:#2c2220;stroke:#a83030}
      .dotN{fill:#4a4944}
    }
  </style>
  <rect class="bg" x=".5" y=".5" width="719" height="359" rx="10"/>
  <text class="ttl" x="24" y="30">처음부터 배우기 vs 이미 배운 눈을 빌려 오기</text>

  <rect class="panel" x="24" y="46" width="324" height="184" rx="8"/>
  <text class="h" x="40" y="68">처음부터 (scratch)</text>
  <rect class="tile" x="40" y="96" width="60" height="44" rx="6"/>
  <text class="sub" x="70" y="116" text-anchor="middle">사진</text>
  <text class="sub" x="70" y="132" text-anchor="middle">300장</text>
  <path class="arr" d="M104 118 H124 M118 112 L124 118 L118 124"/>
  <rect class="badb" x="130" y="86" width="36" height="64" rx="4"/>
  <rect class="badb" x="170" y="86" width="36" height="64" rx="4"/>
  <rect class="badb" x="210" y="86" width="36" height="64" rx="4"/>
  <rect class="badb" x="250" y="86" width="36" height="64" rx="4"/>
  <rect class="badb" x="290" y="100" width="24" height="36" rx="4"/>
  <text class="sub" x="222" y="170" text-anchor="middle">전부 0에서 새로 배움 · 약 1,100만 개</text>
  <text class="bad" x="40" y="212">사진은 적고 배울 건 많음 → 사진을 외움 (과적합)</text>

  <rect class="panel" x="372" y="46" width="324" height="184" rx="8"/>
  <text class="h" x="388" y="68">빌려 오기 (pretrained)</text>
  <rect class="tile" x="388" y="96" width="60" height="44" rx="6"/>
  <text class="sub" x="418" y="116" text-anchor="middle">사진</text>
  <text class="sub" x="418" y="132" text-anchor="middle">300장</text>
  <path class="arr" d="M452 118 H472 M466 112 L472 118 L466 124"/>
  <rect class="grey" x="478" y="86" width="36" height="64" rx="4"/>
  <rect class="grey" x="518" y="86" width="36" height="64" rx="4"/>
  <rect class="grey" x="558" y="86" width="36" height="64" rx="4"/>
  <rect class="grey" x="598" y="86" width="36" height="64" rx="4"/>
  <rect class="ok" x="638" y="100" width="24" height="36" rx="4"/>
  <text class="mut" x="556" y="166" text-anchor="middle">ImageNet 120만 장으로 이미 배운 눈</text>
  <text class="mut" x="556" y="180" text-anchor="middle">(선 · 모양 · 질감) → 그대로 사용</text>
  <text class="good" x="650" y="152" text-anchor="middle">새로</text>
  <text class="good" x="388" y="212">마지막 층만 새로 배움 (1,026개) → 300장으로 충분</text>

  <text class="h" x="24" y="262">수업 실측 — 같은 ResNet18 · 같은 조건 · 꽃 사진 1,080장</text>
  <text class="sub" x="24" y="292">처음부터</text>
  <rect class="barS" x="110" y="279" width="437" height="18" rx="3"/>
  <text class="h" x="555" y="293">85.7%</text>
  <text class="sub" x="24" y="324">빌려 오기</text>
  <rect class="barP" x="110" y="311" width="504" height="18" rx="3"/>
  <text class="h" x="622" y="325">98.9%</text>
  <text class="mut" x="24" y="350">사진이 1,080장이어도 차이가 이만큼. 300장이면 처음부터 배우기는 더 어렵다.</text>
</svg>
