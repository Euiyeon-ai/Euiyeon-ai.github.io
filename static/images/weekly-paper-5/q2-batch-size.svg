<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="t2 d2">
  <title id="t2">배치 크기 정하는 흐름과 양극단의 문제</title>
  <desc id="d2">32에서 64로 시작해 2배씩 키우다가 OOM 직전이 상한이고, 그 안에서 validation loss가 가장 좋은 크기를 고른다. 너무 작으면 gradient가 튀고 GPU가 놀며, 너무 크면 갱신 횟수가 줄고 일반화가 나빠진다.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
    .bg{fill:#fcfcfb;stroke:rgba(11,11,11,.10)}
    .ttl{fill:#0b0b0b;font-size:16px;font-weight:700}
    .h{fill:#0b0b0b;font-size:13px;font-weight:700}
    .sub{fill:#52514e;font-size:12px}
    .mut{fill:#898781;font-size:11.5px}
    .pane{fill:#f4f4f1;stroke:#c3c2b7;stroke-width:1.5}
    .paneBad{fill:#f7ecec;stroke:#d03b3b;stroke-width:1.5}
    .paneOk{fill:#eaf3ec;stroke:#3f8f5a;stroke-width:1.5}
    .ax{stroke:#c3c2b7;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
    .track{stroke:#c3c2b7;stroke-width:3;fill:none}
    .bad{fill:#d03b3b}
    .good{fill:#3f8f5a}
    .badT{fill:#d03b3b;font-size:12px;font-weight:700}
    .goodT{fill:#3f8f5a;font-size:12px;font-weight:700}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1a1a19;stroke:rgba(255,255,255,.10)}
      .ttl,.h{fill:#ffffff}
      .sub{fill:#c3c2b7}
      .mut{fill:#8f8d87}
      .pane{fill:#232322;stroke:#383835}
      .paneBad{fill:#2c2220;stroke:#a83030}
      .paneOk{fill:#1f2a22;stroke:#3f8f5a}
      .ax,.track{stroke:#6b6a64}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/>
    </marker>
  </defs>
  <rect class="bg" x=".5" y=".5" width="719" height="339" rx="10"/>
  <text class="ttl" x="24" y="30">메모리 상한을 먼저 재고, 그 안에서 validation 성능으로 고른다</text>

  <rect class="pane" x="24" y="52" width="150" height="46" rx="8"/>
  <text class="h" x="99" y="71" text-anchor="middle">32 / 64로 시작</text>
  <text class="mut" x="99" y="88" text-anchor="middle">무난한 출발점</text>
  <line class="ax" x1="174" y1="75" x2="200" y2="75"/>
  <rect class="pane" x="202" y="52" width="150" height="46" rx="8"/>
  <text class="h" x="277" y="71" text-anchor="middle">2배씩 키운다</text>
  <text class="mut" x="277" y="88" text-anchor="middle">128, 256, 512 ...</text>
  <line class="ax" x1="352" y1="75" x2="378" y2="75"/>
  <rect class="paneBad" x="380" y="52" width="150" height="46" rx="8"/>
  <text class="h" x="455" y="71" text-anchor="middle">OOM 발생</text>
  <text class="mut" x="455" y="88" text-anchor="middle">바로 전 크기가 상한</text>
  <line class="ax" x1="530" y1="75" x2="556" y2="75"/>
  <rect class="paneOk" x="558" y="52" width="138" height="46" rx="8"/>
  <text class="h" x="627" y="71" text-anchor="middle">상한 안에서 선택</text>
  <text class="mut" x="627" y="88" text-anchor="middle">val loss 기준</text>

  <text class="h" x="24" y="140">배치 크기 스펙트럼</text>
  <line class="track" x1="60" y1="175" x2="660" y2="175"/>
  <circle class="bad" cx="60" cy="175" r="7"/>
  <circle class="good" cx="300" cy="175" r="7"/>
  <circle class="bad" cx="660" cy="175" r="7"/>
  <text class="badT" x="60" y="200" text-anchor="middle">1 ~ 8</text>
  <text class="goodT" x="300" y="200" text-anchor="middle">32 ~ 256</text>
  <text class="badT" x="660" y="200" text-anchor="middle">수만 개</text>
  <text class="mut" x="60" y="160" text-anchor="middle">너무 작게</text>
  <text class="mut" x="300" y="160" text-anchor="middle">보통 여기서 시작</text>
  <text class="mut" x="660" y="160" text-anchor="middle">너무 크게</text>

  <rect class="paneBad" x="24" y="218" width="230" height="100" rx="8"/>
  <text class="h" x="40" y="240">아주 작게 잡으면</text>
  <text class="sub" x="40" y="262">- gradient가 튄다, 수렴 느림</text>
  <text class="sub" x="40" y="282">- GPU가 논다, 에포크당 오래 걸림</text>
  <text class="sub" x="40" y="302">- BatchNorm 통계가 흔들린다</text>

  <rect class="paneOk" x="270" y="218" width="180" height="100" rx="8"/>
  <text class="h" x="286" y="240">상한이 낮으면</text>
  <text class="sub" x="286" y="262">gradient accumulation</text>
  <text class="mut" x="286" y="282">작은 배치 여러 개의 gradient를</text>
  <text class="mut" x="286" y="298">모아서 한 번에 갱신</text>

  <rect class="paneBad" x="466" y="218" width="230" height="100" rx="8"/>
  <text class="h" x="482" y="240">아주 크게 잡으면</text>
  <text class="sub" x="482" y="262">- 에포크당 갱신 횟수가 준다</text>
  <text class="sub" x="482" y="282">- sharp minimum, 일반화 나쁨</text>
  <text class="sub" x="482" y="302">- lr/warmup 튜닝 필요, 메모리 한계</text>
</svg>
