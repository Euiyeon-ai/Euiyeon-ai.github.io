<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t1 d1">
  <title id="t1">완전연결층과 합성곱층의 연결 방식 비교</title>
  <desc id="d1">왼쪽: 완전연결층은 사진의 모든 픽셀이 다음 층의 모든 뉴런과 선으로 이어진다. 오른쪽: 합성곱층은 3×3 작은 창 안의 픽셀만 출력 하나로 이어지고, 같은 창(필터)이 사진 위를 옮겨 다닌다.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
    .bg{fill:#fcfcfb;stroke:rgba(11,11,11,.10)}
    .ttl{fill:#0b0b0b;font-size:16px;font-weight:700}
    .h{fill:#0b0b0b;font-size:13px;font-weight:700}
    .sub{fill:#52514e;font-size:12px}
    .mut{fill:#898781;font-size:11.5px}
    .px{fill:#f4f4f1;stroke:#c3c2b7;stroke-width:1}
    .pxOn{fill:#fbe2d6;stroke:#eb6834;stroke-width:1.5}
    .node{fill:#f4f4f1;stroke:#c3c2b7;stroke-width:1.5}
    .nodeOn{fill:#fbe2d6;stroke:#eb6834;stroke-width:1.5}
    .wire{stroke:#2a78d6;stroke-width:.7;opacity:.55}
    .wireOn{stroke:#eb6834;stroke-width:1.4}
    .win{fill:none;stroke:#eb6834;stroke-width:2;stroke-dasharray:4 3}
    .fc{fill:#2a78d6;font-size:12px;font-weight:700}
    .cnn{fill:#eb6834;font-size:12px;font-weight:700}
    @media (prefers-color-scheme:dark){
      .bg{fill:#1a1a19;stroke:rgba(255,255,255,.10)}
      .ttl,.h{fill:#ffffff}
      .sub{fill:#c3c2b7}
      .mut{fill:#8f8d87}
      .px,.node{fill:#232322;stroke:#383835}
      .pxOn,.nodeOn{fill:#3a2a22;stroke:#d95926}
      .wire{stroke:#3987e5}
      .wireOn,.win{stroke:#d95926}
      .fc{fill:#3987e5}
      .cnn{fill:#d95926}
    }
  </style>
  <rect class="bg" x=".5" y=".5" width="759" height="299" rx="10"/>
  <text class="ttl" x="24" y="30">연결 방식이 다르다: 전부 잇기 vs 근처만 잇기</text>

  <text class="fc" x="60" y="62">완전연결(FC)</text>
  <text class="mut" x="60" y="78">픽셀 6×6 = 36개 → 뉴런 5개, 선 180개</text>
  <g>
    <rect class="px" x="60" y="95" width="20" height="20"/><rect class="px" x="80" y="95" width="20" height="20"/><rect class="px" x="100" y="95" width="20" height="20"/><rect class="px" x="120" y="95" width="20" height="20"/><rect class="px" x="140" y="95" width="20" height="20"/><rect class="px" x="160" y="95" width="20" height="20"/>
    <rect class="px" x="60" y="115" width="20" height="20"/><rect class="px" x="80" y="115" width="20" height="20"/><rect class="px" x="100" y="115" width="20" height="20"/><rect class="px" x="120" y="115" width="20" height="20"/><rect class="px" x="140" y="115" width="20" height="20"/><rect class="px" x="160" y="115" width="20" height="20"/>
    <rect class="px" x="60" y="135" width="20" height="20"/><rect class="px" x="80" y="135" width="20" height="20"/><rect class="px" x="100" y="135" width="20" height="20"/><rect class="px" x="120" y="135" width="20" height="20"/><rect class="px" x="140" y="135" width="20" height="20"/><rect class="px" x="160" y="135" width="20" height="20"/>
    <rect class="px" x="60" y="155" width="20" height="20"/><rect class="px" x="80" y="155" width="20" height="20"/><rect class="px" x="100" y="155" width="20" height="20"/><rect class="px" x="120" y="155" width="20" height="20"/><rect class="px" x="140" y="155" width="20" height="20"/><rect class="px" x="160" y="155" width="20" height="20"/>
    <rect class="px" x="60" y="175" width="20" height="20"/><rect class="px" x="80" y="175" width="20" height="20"/><rect class="px" x="100" y="175" width="20" height="20"/><rect class="px" x="120" y="175" width="20" height="20"/><rect class="px" x="140" y="175" width="20" height="20"/><rect class="px" x="160" y="175" width="20" height="20"/>
    <rect class="px" x="60" y="195" width="20" height="20"/><rect class="px" x="80" y="195" width="20" height="20"/><rect class="px" x="100" y="195" width="20" height="20"/><rect class="px" x="120" y="195" width="20" height="20"/><rect class="px" x="140" y="195" width="20" height="20"/><rect class="px" x="160" y="195" width="20" height="20"/>
  </g>
  <g class="wire">
    <line x1="180" y1="105" x2="290" y2="110"/><line x1="180" y1="105" x2="290" y2="135"/><line x1="180" y1="105" x2="290" y2="160"/><line x1="180" y1="105" x2="290" y2="185"/><line x1="180" y1="105" x2="290" y2="210"/>
    <line x1="180" y1="125" x2="290" y2="110"/><line x1="180" y1="125" x2="290" y2="135"/><line x1="180" y1="125" x2="290" y2="160"/><line x1="180" y1="125" x2="290" y2="185"/><line x1="180" y1="125" x2="290" y2="210"/>
    <line x1="180" y1="145" x2="290" y2="110"/><line x1="180" y1="145" x2="290" y2="135"/><line x1="180" y1="145" x2="290" y2="160"/><line x1="180" y1="145" x2="290" y2="185"/><line x1="180" y1="145" x2="290" y2="210"/>
    <line x1="180" y1="165" x2="290" y2="110"/><line x1="180" y1="165" x2="290" y2="135"/><line x1="180" y1="165" x2="290" y2="160"/><line x1="180" y1="165" x2="290" y2="185"/><line x1="180" y1="165" x2="290" y2="210"/>
    <line x1="180" y1="185" x2="290" y2="110"/><line x1="180" y1="185" x2="290" y2="135"/><line x1="180" y1="185" x2="290" y2="160"/><line x1="180" y1="185" x2="290" y2="185"/><line x1="180" y1="185" x2="290" y2="210"/>
    <line x1="180" y1="205" x2="290" y2="110"/><line x1="180" y1="205" x2="290" y2="135"/><line x1="180" y1="205" x2="290" y2="160"/><line x1="180" y1="205" x2="290" y2="185"/><line x1="180" y1="205" x2="290" y2="210"/>
  </g>
  <circle class="node" cx="300" cy="110" r="10"/><circle class="node" cx="300" cy="135" r="10"/><circle class="node" cx="300" cy="160" r="10"/><circle class="node" cx="300" cy="185" r="10"/><circle class="node" cx="300" cy="210" r="10"/>
  <text class="mut" x="300" y="238" text-anchor="middle">뉴런 5개</text>
  <text class="sub" x="190" y="268" text-anchor="middle">가중치 = 픽셀 수 × 뉴런 수 (선 하나마다 하나)</text>
  <text class="sub" x="190" y="284" text-anchor="middle">사진이 커지면 선이 그만큼 늘어난다</text>

  <text class="cnn" x="440" y="62">합성곱(CNN)</text>
  <text class="mut" x="440" y="78">3×3 창 하나 = 가중치 9개, 창을 옮겨 재사용</text>
  <g>
    <rect class="px" x="440" y="95" width="20" height="20"/><rect class="px" x="460" y="95" width="20" height="20"/><rect class="px" x="480" y="95" width="20" height="20"/><rect class="px" x="500" y="95" width="20" height="20"/><rect class="px" x="520" y="95" width="20" height="20"/><rect class="px" x="540" y="95" width="20" height="20"/>
    <rect class="pxOn" x="440" y="115" width="20" height="20"/><rect class="pxOn" x="460" y="115" width="20" height="20"/><rect class="pxOn" x="480" y="115" width="20" height="20"/><rect class="px" x="500" y="115" width="20" height="20"/><rect class="px" x="520" y="115" width="20" height="20"/><rect class="px" x="540" y="115" width="20" height="20"/>
    <rect class="pxOn" x="440" y="135" width="20" height="20"/><rect class="pxOn" x="460" y="135" width="20" height="20"/><rect class="pxOn" x="480" y="135" width="20" height="20"/><rect class="px" x="500" y="135" width="20" height="20"/><rect class="px" x="520" y="135" width="20" height="20"/><rect class="px" x="540" y="135" width="20" height="20"/>
    <rect class="pxOn" x="440" y="155" width="20" height="20"/><rect class="pxOn" x="460" y="155" width="20" height="20"/><rect class="pxOn" x="480" y="155" width="20" height="20"/><rect class="px" x="500" y="155" width="20" height="20"/><rect class="px" x="520" y="155" width="20" height="20"/><rect class="px" x="540" y="155" width="20" height="20"/>
    <rect class="px" x="440" y="175" width="20" height="20"/><rect class="px" x="460" y="175" width="20" height="20"/><rect class="px" x="480" y="175" width="20" height="20"/><rect class="px" x="500" y="175" width="20" height="20"/><rect class="px" x="520" y="175" width="20" height="20"/><rect class="px" x="540" y="175" width="20" height="20"/>
    <rect class="px" x="440" y="195" width="20" height="20"/><rect class="px" x="460" y="195" width="20" height="20"/><rect class="px" x="480" y="195" width="20" height="20"/><rect class="px" x="500" y="195" width="20" height="20"/><rect class="px" x="520" y="195" width="20" height="20"/><rect class="px" x="540" y="195" width="20" height="20"/>
  </g>
  <rect class="win" x="500" y="115" width="60" height="60" rx="2" opacity=".55"/>
  <rect class="win" x="500" y="155" width="60" height="60" rx="2" opacity=".3"/>
  <text class="mut" x="600" y="110" text-anchor="middle">같은 창을</text>
  <text class="mut" x="600" y="124" text-anchor="middle">옮겨 가며 씀 →</text>
  <g class="wireOn">
    <line x1="450" y1="125" x2="670" y2="145"/><line x1="470" y1="125" x2="670" y2="145"/><line x1="490" y1="125" x2="670" y2="145"/>
    <line x1="450" y1="145" x2="670" y2="145"/><line x1="470" y1="145" x2="670" y2="145"/><line x1="490" y1="145" x2="670" y2="145"/>
    <line x1="450" y1="165" x2="670" y2="145"/><line x1="470" y1="165" x2="670" y2="145"/><line x1="490" y1="165" x2="670" y2="145"/>
  </g>
  <circle class="nodeOn" cx="680" cy="145" r="10"/>
  <text class="mut" x="680" y="175" text-anchor="middle">출력 1칸</text>
  <text class="mut" x="680" y="190" text-anchor="middle">(특징 맵)</text>
  <text class="sub" x="590" y="268" text-anchor="middle">가중치 9개를 사진 어디서나 똑같이 쓴다</text>
  <text class="sub" x="590" y="284" text-anchor="middle">사진이 커져도 가중치 수는 그대로</text>
</svg>
